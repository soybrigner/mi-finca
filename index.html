<style>
/* Layout: one narrow column like a field ledger. Summary on top, animals as rows, each animal opens to its own record sheet.
   The yellow ear tag (arete) is the single bold element; everything else stays quiet. */
:root{
  --bg:#edf0ea; --surface:#ffffff; --surface2:#e3e8e0; --fg:#18211b; --muted:#566259; --line:#cfd7cb;
  --accent:#2a6743; --accent-fg:#ffffff; --chip-bg:#d3e8d4; --chip-fg:#1d5a2b; --dot:rgba(24,33,27,.05);
  --tag:#f0c030; --tag-fg:#2b2300; --cost:#b4741c;
  --warn:#a83d19; --warn-bg:#f6dfd4; --good:#23603b; --good-bg:#d8e9dc; --soon:#5f4a00; --soon-bg:#f7e9b8;
  --todo:#1f4e7c; --todo-bg:#dbe8f5; --sell:#93dba5; --sell-fg:#0d2b17; --note-bg:#cfe0f3; --note-fg:#1b4572; --note-card:#e8f0f9; --note-line:#b7cde6;
  --scrim:rgba(10,16,12,.62); --on-scrim:#ffffff;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-look="light"]){
    --bg:#100f0e; --surface:#1a1917; --surface2:#262421; --fg:#f2eee7; --muted:#a8a298; --line:#2f2c28;
    --accent:#8fd16f; --accent-fg:#10200a; --chip-bg:#2d5a2c; --chip-fg:#b9e89c; --dot:rgba(255,255,255,.05);
    --tag:#e9bb2a; --tag-fg:#2b2300; --cost:#e0a24f;
    --warn:#ff9d78; --warn-bg:#3b2218; --good:#8fd69f; --good-bg:#1d3a24; --soon:#f2d46b; --soon-bg:#3a3012;
    --todo:#8fc2f0; --todo-bg:#1b2a3a; --sell:#c9f2b0; --sell-fg:#12240b; --note-bg:#27446c; --note-fg:#c6defa; --note-card:#16212e; --note-line:#2c4668;
    --scrim:rgba(0,0,0,.72); --on-scrim:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-look="dark"]{
  --bg:#100f0e; --surface:#1a1917; --surface2:#262421; --fg:#f2eee7; --muted:#a8a298; --line:#2f2c28;
  --accent:#8fd16f; --accent-fg:#10200a; --chip-bg:#2d5a2c; --chip-fg:#b9e89c; --dot:rgba(255,255,255,.05);
  --tag:#e9bb2a; --tag-fg:#2b2300; --cost:#e0a24f;
  --warn:#ff9d78; --warn-bg:#3b2218; --good:#8fd69f; --good-bg:#1d3a24; --soon:#f2d46b; --soon-bg:#3a3012;
  --todo:#8fc2f0; --todo-bg:#1b2a3a; --sell:#c9f2b0; --sell-fg:#12240b; --note-bg:#27446c; --note-fg:#c6defa; --note-card:#16212e; --note-line:#2c4668;
  --scrim:rgba(0,0,0,.72); --on-scrim:#ffffff;
  color-scheme:dark;
}
:root[data-look="light"]{
  --bg:#edf0ea; --surface:#ffffff; --surface2:#e3e8e0; --fg:#18211b; --muted:#566259; --line:#cfd7cb;
  --accent:#2a6743; --accent-fg:#ffffff; --chip-bg:#d3e8d4; --chip-fg:#1d5a2b; --dot:rgba(24,33,27,.05);
  --tag:#f0c030; --tag-fg:#2b2300; --cost:#b4741c;
  --warn:#a83d19; --warn-bg:#f6dfd4; --good:#23603b; --good-bg:#d8e9dc; --soon:#5f4a00; --soon-bg:#f7e9b8;
  --todo:#1f4e7c; --todo-bg:#dbe8f5; --sell:#93dba5; --sell-fg:#0d2b17; --note-bg:#cfe0f3; --note-fg:#1b4572; --note-card:#e8f0f9; --note-line:#b7cde6;
  --scrim:rgba(10,16,12,.62); --on-scrim:#ffffff;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg) radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.4px) 0 0 / 22px 22px; color:var(--fg); font:16px/1.45 var(--body);
  padding-block:0 110px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
body.noscroll{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* ear tag */
.tag{display:inline-flex;align-items:center;position:relative;background:var(--tag);color:var(--tag-fg);
  font-family:var(--display);font-weight:700;letter-spacing:.05em;line-height:1;padding:4px 10px 4px 21px;
  border-radius:3px 10px 10px 3px;font-size:16px;white-space:nowrap;max-width:100%}
.tag::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:rgba(0,0,0,.3)}
.tag.lg{font-size:24px;padding:6px 14px 6px 26px;border-radius:4px 14px 14px 4px}
.tag.lg::before{left:9px;width:9px;height:9px;margin-top:-4.5px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;min-height:62px;padding-block:8px}
.top .brand{font-size:21px;padding:6px 12px 6px 23px}
.top .brand::before{left:8px}
.top-sub{font-size:14px;color:var(--muted);letter-spacing:.02em}
.top .sp{flex:1}
.top-title{font:600 17px var(--body)}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:10px;cursor:pointer;flex:none;text-decoration:none}
.icon-btn:active{background:var(--surface2)}
.ic{width:22px;height:22px;flex:none}

/* ledger summary */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger>div{background:var(--surface);padding:12px 14px;min-width:0}
.k{display:block;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.v{display:block;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.v small{font-size:15px;font-weight:500;color:var(--muted)}
.v.pos{color:var(--good)} .v.neg{color:var(--warn)}

/* sections */
h3.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 12px;padding-top:9px;border-top:2px solid var(--fg);
  font:700 22px/1.1 var(--display);letter-spacing:.07em;text-transform:uppercase}
h3.sec.first{margin-top:22px}
h3.sec .count{font-size:17px;color:var(--muted)}
h3.sec .pill{text-transform:none;letter-spacing:0;font-family:var(--body)}
#view>h3.sec:first-child{margin-top:20px}
.ledger{margin-top:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 auto;min-height:48px;padding:0 10px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs.iconic button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:6px 4px;font-size:13px;font-weight:600}
.tabs.iconic button .ic{width:26px;height:26px}
.tabs.iconic button[aria-selected="true"] .ic{color:var(--accent)}
.alertline{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:16px;min-height:46px;padding:0 14px;border:0;border-radius:11px;background:var(--soon-bg);color:var(--soon);font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.alertline.late{background:var(--warn-bg);color:var(--warn)}
.todos{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--soon-bg);color:var(--soon)}
.todo.late{background:var(--warn-bg);color:var(--warn)}
.todo-t{min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.todo .btn{flex:none}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:64px;padding:10px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-align:left;cursor:pointer}
.qa-t{font-size:17px;font-weight:600}
.qa-s{font-size:14px;color:var(--muted)}
.qa.urgent{background:var(--soon-bg);border-color:transparent;color:var(--soon)}
.qa.urgent.late{background:var(--warn-bg);color:var(--warn)}
.qa.urgent .qa-s{color:inherit}
.banner{margin-top:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soon-bg);color:var(--soon);border-radius:10px;padding:10px 12px;font-size:15px}
.banner .btn{flex:none}

/* pills */
.pill{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600;line-height:1.2}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.good{background:var(--good-bg);color:var(--good)}

/* pending */
.pend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none}
.pend b{font-weight:600}
.pend .pill{margin-left:auto}

/* filters */
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;margin-top:16px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.icons button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;padding:6px 2px;font-size:13px;line-height:1.2}
.seg.icons button .ic{width:24px;height:24px}
.seg.icons button small{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.icons button[aria-pressed="true"] .ic{color:var(--accent)}
.seg.icons button[aria-pressed="true"] small{color:var(--fg)}
#homebar{margin-top:16px}
#q{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px}

/* animal rows */
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:inherit}
.row:active{background:var(--surface2)}
.thumb{width:64px;height:64px;border-radius:9px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);text-align:center;padding:4px}
.thumb.lg{width:84px;height:84px}
.rt{display:flex;align-items:center;gap:8px;min-width:0}
.rt strong{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:14px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rw{text-align:right;line-height:1}
.rw .num{font-size:28px;font-weight:600}
.rw .u{display:block;font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.05em}
.empty-note{margin-top:24px;color:var(--muted);text-align:center}
.empty{margin-top:40px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h2{font:700 30px/1.1 var(--display);letter-spacing:.02em}
.empty p{color:var(--muted);max-width:34ch}
.sk{height:84px;border-radius:12px;background:var(--surface2);margin-top:10px}

/* detail */
.d-head{padding-top:6px}
.d-head .d-tags{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-name{font:700 40px/1.05 var(--display);margin-top:10px;letter-spacing:.01em;overflow-wrap:anywhere}
.d-sub{color:var(--muted);margin-top:4px}
.d-notes{margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:15px;overflow-wrap:anywhere}
.ph-one,.ph-pair{margin-top:18px}
.ph-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig{margin:0;min-width:0}
.zoom-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.fig img{display:block;width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:11px;background:var(--surface2)}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.fig figcaption b{color:var(--fg);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.ph-empty{margin-top:18px;border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.wbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wbig .num{font-size:52px;font-weight:600;line-height:1}
.wbig .u{font-size:16px;color:var(--muted);font-weight:500}
.wsub{margin-top:8px;font-size:15px}
.small{font-size:13px}
.note{color:var(--muted);margin-top:8px}
.ch{display:block;width:100%;height:auto;margin-top:14px}
.ch .gl{stroke:var(--line);stroke-width:1;fill:none}
.ch .yl,.ch .xl{fill:var(--muted);font:500 11px var(--body)}
.ch .area{fill:var(--accent);fill-opacity:.12;stroke:none}
.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .proj{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.ch .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .dot.hollow{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.ch .val{fill:var(--fg);font:700 13px var(--display);letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.stats .v{font-size:24px}
.agebig{font:600 34px/1 var(--display)}
.agebar{position:relative;height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;margin-top:12px}
.agebar .win{position:absolute;top:0;bottom:0;left:75%;right:0;background:var(--soon-bg)}
.agebar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:7px 0 0 7px}
.agelbl{position:relative;height:18px;font-size:12px;color:var(--muted);margin-top:4px}
.agelbl span{position:absolute;top:0;transform:translateX(-50%)}
.agelbl span:first-child{transform:none}
.agelbl span:last-child{transform:translateX(-100%)}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ev li.plain{grid-template-columns:minmax(0,1fr) auto}
.ev .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.ev .m{font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.ev .m .d{color:var(--good);font-weight:600}
.ev .m .d.neg{color:var(--warn)}
.ev .n{font-size:14px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.sec-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-left:12px}
.tbl tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--fg);font-size:17px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;margin:0}
.kv dt{color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);text-align:right;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv dd.pos{color:var(--good)} .kv dd.neg{color:var(--warn)}
.profit{font:700 40px/1 var(--display);margin-bottom:10px}
.profit.pos{color:var(--good)} .profit.neg{color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.sm{min-height:40px;padding:0 13px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.wide{width:100%}


/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px 4px max(18px, env(safe-area-inset-left,0px))}
.sheet-head h2{font:700 26px/1.1 var(--display);letter-spacing:.02em}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px, env(safe-area-inset-right,0px)) 14px max(16px, env(safe-area-inset-left,0px))}
.sheet-foot{display:flex;gap:10px;padding:10px max(16px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.err{color:var(--warn);font-weight:600;margin:4px 0 12px}
.menu{display:flex;flex-direction:column}
.menu-item{display:block;width:100%;text-align:left;min-height:54px;padding:0 4px;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;font-weight:500;cursor:pointer}
.menu-item.danger{color:var(--warn)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fld>label,.fld>.lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fld .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],input[type=email],textarea{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.two>*{min-width:0;max-width:100%}
/* campos de fecha: en el iPhone traen un ancho propio y se salían de su cajón; así quedan del tamaño del cajón y alineados como los demás */
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;height:48px;margin:0;overflow:hidden;text-align:left;line-height:1.25}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;min-height:1.25em;margin:0;padding:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{position:relative;flex:1 1 0;min-width:0}
.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opts span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:4px 8px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-weight:600;font-size:15px}
.opts input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opts input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.opts.bcs span{min-height:44px;flex-direction:column;line-height:1.1;font-size:17px}
.opts.bcs small{font-size:11px;font-weight:500;opacity:.85}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.photo-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* lotes */
.lotchip{display:inline-flex;align-items:center;min-height:26px;padding:2px 11px;border-radius:7px;background:var(--accent);color:var(--accent-fg);font:700 16px/1.1 var(--display);letter-spacing:.04em;text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.lotchip.lg{font-size:20px;min-height:34px;padding:4px 13px}
a.lotchip:active{opacity:.85}
.lotcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit}
.lotcard:active{background:var(--surface2)}
.lotcard.merged{background:transparent;border-style:dashed}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lc-sub{color:var(--muted);font-size:14px;margin-top:6px}
.lc-fin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lc-fin i{display:block;font-style:normal;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lc-fin b{display:block;font:600 22px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ledger.tri{grid-template-columns:repeat(3,minmax(0,1fr))}
.ledger.tri>div{padding:10px 9px}
.ledger.tri .k{font-size:11px;letter-spacing:.05em}
.ledger.tri .v{font-size:20px;overflow-wrap:normal;white-space:nowrap}
.ledger.tri .v.sm{font-size:16px}
.ledger.tri .v.xs{font-size:14px}
.picks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:260px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.pick .tag{font-size:14px;flex:none}
.pk-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-w{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick-actions{display:flex;gap:8px;margin-top:10px}
.gp{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0 12px;background:var(--surface)}
.gp .fld{margin-bottom:10px}
.gps:not(.multi) .gp{border:0;padding:0;background:none;margin:14px 0 0}
.gps:not(.multi) .gp-extra{display:none}
.gp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.gp-head .lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sumline{padding:11px 14px;border-radius:11px;background:var(--surface2);font-weight:600;font-size:15px;margin-bottom:14px}
.sumline.warn{background:var(--warn-bg);color:var(--warn)}
.btn.period{justify-content:space-between;margin-top:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw-out{background:var(--cost)} .sw-in{background:var(--accent)}
.b-out{fill:var(--cost)} .b-in{fill:var(--accent)}
.dtl{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.dtl summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.tbl.dt th{text-align:right;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0 8px 12px;border-bottom:2px solid var(--fg)}
.tbl.dt th:first-child{text-align:left;padding-left:0}
.tbl.dt td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;font-weight:500}
.tbl.dt td:first-child{text-align:left;padding-left:0}
@media (min-width:480px){.ledger.tri .v{font-size:23px}.ledger.tri .v.sm{font-size:19px}.ledger.tri .v.xs{font-size:16px}}
[hidden]{display:none!important}
.opts.col{flex-direction:column}
.opts.col label{flex:none}
.opts.col span{justify-content:flex-start;padding:4px 14px;text-align:left}
.ledger:not(.tri) .v.sm2{font-size:25px;overflow-wrap:normal;white-space:nowrap}
.ledger:not(.tri) .v.xs2{font-size:21px;overflow-wrap:normal;white-space:nowrap}

/* personas */
.req{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--soon-bg);color:var(--soon);font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:none;vertical-align:1px}
select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px}
.row.prow{grid-template-columns:48px minmax(0,1fr)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 19px var(--display);letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.lotchip.pers{background:var(--fg);color:var(--bg)}
.plink{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pp-opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:52px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--fg)}
.pp-opt:last-child{border-bottom:0}
.pp-opt:active{background:var(--surface2)}
.pp-opt small{color:var(--muted);font-size:13px}
.pp-opt.add{color:var(--accent);justify-content:center}
.pp-more{padding:8px 12px;font-size:13px;color:var(--muted)}
.pp-sel{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-size:14px;font-weight:600}
.pp-new{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.pp-new .fld{margin-bottom:10px}
.pp-h{font:700 18px var(--display);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.pp-btns{display:flex;gap:10px;justify-content:flex-end}

/* inicio: tarjetas y barra de abajo */
.top.home{min-height:84px;padding-top:14px}
.brandbox{display:flex;flex-direction:column;gap:4px;min-width:0}
.brandname{font:700 34px/1 var(--body);letter-spacing:-.015em}
.eyebrow{margin:26px 2px 12px;font:600 12.5px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hcard{display:flex;flex-direction:column;align-items:flex-start;min-height:140px;padding:16px 14px 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--fg);text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hcard:active{background:var(--surface2)}
.hcard b{font:700 21px/1.15 var(--body);letter-spacing:-.005em}
.hcard small{margin-top:3px;font-size:13.5px;line-height:1.3;color:var(--muted)}
.hic{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--chip-bg);color:var(--chip-fg);flex:none;margin-bottom:14px}
.hic .ic{width:24px;height:24px}
.hic.sm{width:38px;height:38px;margin:0}
.hic.sm .ic{width:21px;height:21px}
.phead{display:flex;align-items:center;gap:12px;margin-top:6px}
.phead h2{font:700 28px/1.1 var(--body);letter-spacing:-.01em}
.alertline.todoline{background:var(--todo-bg);color:var(--todo);margin-top:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:560px;margin:0 auto;display:flex;gap:2px;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(6px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px))}
.bn{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;padding:0 2px;border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.bn .pi{position:relative;display:grid;place-items:center;width:58px;height:34px;border-radius:17px}
.bn .pi .ic{width:24px;height:24px}
.bn[aria-current="page"]{color:var(--fg)}
.bn[aria-current="page"] .pi{background:var(--chip-bg);color:var(--chip-fg)}
.bn .bdg{position:absolute;top:-4px;right:3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--todo);color:var(--todo-bg);font:700 12px/19px var(--body);text-align:center;font-style:normal}
body.has-nav{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}

body.has-nav .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* propósito */
.pill.purp{background:var(--chip-bg);color:var(--chip-fg)}
.pills{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pchips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{flex:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-bg);color:var(--chip-fg);border-color:transparent}
.opts.purp label{flex:1 1 calc(50% - 4px)}
.opts.purp label.none{flex-basis:100%}
.opts.purp span{flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:1px;padding:8px 12px;min-height:58px}
.opts.purp label.none span{align-items:center;min-height:46px}
.opts.purp b{font-size:16px}
.opts.purp small{font-size:12.5px;font-weight:500;opacity:.85}

/* leche */
.mhero{margin-top:16px;padding:18px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.mhero .big{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.mhero .big .num{font-size:60px;font-weight:700;line-height:1}
.mhero .big .u{font-size:20px;color:var(--muted);font-weight:600}
.mhero .sub{margin-top:8px;color:var(--muted);font-size:15px}
.mhero .btn{margin-top:14px}
.row.mrow{grid-template-columns:minmax(0,1fr) auto;width:100%;text-align:left;cursor:pointer;font:inherit}

/* notas */
.nlist{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ncheck{flex:none;width:52px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer}
.ncheck .ic{width:26px;height:26px}
.nrow.done .ncheck{color:var(--accent)}
.ntext{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 12px 0;border:0;background:none;text-align:left;cursor:pointer;font-size:16px}
.ntext .nt{overflow-wrap:anywhere}
.nrow.done .nt{text-decoration:line-through;color:var(--muted)}

/* logo, razas, madre y calendario */
.logo{width:48px;height:48px;flex:none;border-radius:14px;background:var(--chip-bg);color:var(--chip-fg);display:grid;place-items:center}
.logo svg{width:32px;height:32px}
.ac-list .pp-opt{min-height:46px}
.cal{scroll-margin-top:90px}
.cal h3.sec{justify-content:flex-start;gap:10px}
.cal h3.sec .ic{width:22px;height:22px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav b{font:700 20px/1.1 var(--body)}
.cal-ttl{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap;justify-content:center}
.phead .icon-btn{margin-left:auto}
.d-mom{margin-top:4px;color:var(--muted)}
.icon-btn.flip .ic{transform:scaleX(-1)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:6px;padding:6px 0;text-align:center;font:600 12px/1 var(--body);letter-spacing:.1em;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:50px;padding:0;border:1px solid transparent;border-radius:12px;background:var(--surface);color:var(--fg);font:600 16px/1 var(--body);cursor:pointer}
.cd.out{background:transparent;color:var(--muted);opacity:.55}
.cd.today{border-color:var(--accent)}
.cd.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);opacity:1}
.cd .dt{width:6px;height:6px;border-radius:50%;background:var(--todo)}
.cd .dt.dn{background:var(--muted)}
.cd .dt.off{visibility:hidden}
.cd.sel .dt{background:var(--accent-fg)}
.cal-day{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cal-day .nrow{background:var(--bg)}
.cal-dt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:17px}

/* hoja de vida, ingreso y cuentas */
.hoja{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.hoja-top{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid var(--fg)}
.hoja-top .thumb{width:72px;height:72px;flex:none}
.hoja-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.hoja-t{font:700 26px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.hoja-s{color:var(--muted);font-size:14px}
.hoja .kv{margin-top:2px}
.top-sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth{display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);padding:20px 0}
.auth-brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo.lg{width:64px;height:64px;border-radius:18px}
.logo.lg svg{width:42px;height:42px}
.auth-card{padding:20px 18px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.auth-card h2{font:700 28px/1.1 var(--body);letter-spacing:-.01em;margin-bottom:14px}
.auth-card .fld{margin-bottom:14px}
.pw{position:relative}
.pw input{padding-right:54px}
.pw-eye{position:absolute;right:2px;top:2px;width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer}
.pw-eye[aria-pressed="true"]{color:var(--accent)}
.chk{display:flex;align-items:flex-start;gap:12px;margin:4px 0 14px;font-size:15px;line-height:1.35;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.link{min-height:44px;padding:0 6px;border:0;background:none;color:var(--accent);font:600 15px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.auth-alt{text-align:center;margin-top:4px}
.auth-new{margin-top:14px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.auth-new p{margin-bottom:10px;color:var(--muted)}
.note-box{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--todo-bg);color:var(--todo);font-size:15px;line-height:1.4}
.ok-box{margin-bottom:14px;padding:12px 14px;border-radius:12px;background:var(--good-bg);color:var(--good);font-size:15px;font-weight:600}
.menu-item.acc{display:block;padding:12px 4px;line-height:1.3}
.menu-item.acc small{display:block;margin-top:2px;color:var(--muted);font-size:14px;font-weight:400;overflow-wrap:anywhere}
body.authing .wrap{padding-top:0}

.tabs:not(.iconic):has(button:nth-child(4)){gap:0}
.tabs:not(.iconic):has(button:nth-child(4)) button{padding:0 6px;font-size:14px;letter-spacing:-.01em}
/* ---- versión 10 ---- */
.fabs{position:fixed;z-index:6;right:calc(max(16px, (100vw - 560px)/2 + 16px) + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;pointer-events:none}
.fabs .fab{pointer-events:auto}
.fab{min-height:54px;padding:0 22px 0 18px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab.fab2{background:var(--sell);color:var(--sell-fg)}
body.has-nav .fabs{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.tabs.iconic button{justify-content:flex-start;gap:4px;min-height:72px;padding:9px 2px 6px;font-size:12.5px;line-height:1.15;white-space:normal;text-align:center;flex:1 1 0;min-width:0}
.tabs.iconic button .ic{width:24px;height:24px;flex:none}
@media (max-width:359px){.tabs.iconic button{font-size:11px}}
input[data-money],input[data-doc]{font-size:20px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.qrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:16px}
.qk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:68px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer}
.qk .ic{width:26px;height:26px;color:var(--accent)}
.qk:active{background:var(--surface2)}
/* v11: vacunas y ganado avaluado */
.hcard small:has(+ .hbar){margin-bottom:12px}
.hbar{display:block;width:100%;height:7px;border-radius:4px;background:var(--surface2);margin-top:auto;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.vc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vc-top b{font:700 24px/1.1 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.vbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin-top:12px}
.vbar i{display:block;height:100%;min-width:5px}
.vbar .ok{background:var(--good)} .vbar .soon{background:var(--soon)} .vbar .late{background:var(--warn)}
.vc-line{margin-top:10px;font-size:16px}
.vc-line strong{font:700 28px/1 var(--display);margin-right:2px}
.vleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--muted)}

.syncpill[data-st="pend"]::before{background:var(--todo);animation:spPulse 1.2s ease-in-out infinite}
.syncpill[data-st="done"]::before{background:var(--good)}
@keyframes spPulse{50%{opacity:.35}}
body.has-nav .syncpill{max-width:calc(100vw - 24px - 124px)}
body.authing .syncpill{display:none}
.lo-st{margin-top:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.lo-st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.lo-st[data-st="off"]::before,.lo-st[data-st="off-pend"]::before{background:var(--cost)}
.lo-st[data-st="pend"]::before{background:var(--todo)}
.lo-st[data-st="ok"]::before{background:var(--good)}
.billbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--soon-bg);color:var(--soon);font-size:14px;font-weight:600;line-height:1.35}
.billbar.warn{background:var(--warn-bg);color:var(--warn)}
.billbar>span{flex:1 1 200px;min-width:0}
.billbar .muted{color:inherit;opacity:.85;font-weight:500}
.hcard .hlock{position:absolute;top:5px;right:5px;display:flex;width:20px;height:20px;align-items:center;justify-content:center;color:var(--muted)}
.hcard .hlock .ic{width:14px;height:14px}
.hcard.locked{opacity:.8}
.plancard{margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.plancard.mine{border-color:var(--good)}
.plancard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plancard .ph>b{font:700 20px/1.2 var(--body)}
.plancard .pp{margin:2px 0 6px;font-size:15px}
.plancard .pp span{color:var(--muted);font-size:13px}
.plancard p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.4}
.lockedmod .lockic{display:inline-flex;width:56px;height:56px;border-radius:18px;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted);margin-bottom:12px}
.lockedmod .lockic .ic{width:28px;height:28px}
.qa .qa-lock{display:inline-block;margin-top:5px;padding:0 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font:700 11px/20px var(--body)}
code{font:600 13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.syncpill::before{animation:none!important}}

function mutateIn(coll, id, fn){

    const cur = ({ animals: S.animals, lots: S.lots, sales: S.sales, people: S.people, milk: S.milk, notes: S.notes, accounts: S.accounts, avaluos: S.deals, paddocks: S.paddocks, moves: S.moves, stock: S.stock, feeds: S.feeds, plans: S.plans, workers: S.workers })[coll].find(x => x.id === id); if(!cur) throw new Error('missing');

async function pool(items, fn, size){

async function delAssets(ids){

function shrink(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function uploadPhoto(file){
  if(!S.assets) throw new Error('Subir fotos requiere permiso de edición.');
  let blob;
  try { blob = await shrink(file, 1280); } catch(e){ throw new Error('No se pudo leer esa foto. Prueba con otra.'); }
  try { const r = await S.assets.upload(blob, { type: 'image/jpeg' }); return r.id; }
  catch(e){
    const c = e && e.code;
    throw new Error(c === 'quota_or_state' ? 'Se llenó el espacio para fotos de esta app.' : c === 'rate_limited' ? 'Muchas fotos seguidas. Espera un momento e intenta de nuevo.' : 'No se pudo subir la foto. Revisa tu conexión e intenta de nuevo.');
  }
}

function chartSVG(a, e){
  const w = weighted(a); if(!w.length) return '';
  const act = stOf(a) === 'activo', t = today();
  const Wd = 360, H = 196, Lm = 40, Rm = 16, T = 28, B = 28;
  const pts = w.map(c => ({ x: parseD(c.date), y: c.weight }));
  const proj = (act && e && e.since > 0) ? { x: parseD(t), y: e.weight } : null;
  const all = proj ? pts.concat([proj]) : pts;
  let x0 = Math.min.apply(null, all.map(p => p.x)), x1 = Math.max.apply(null, all.map(p => p.x));
  if(x1 === x0){ x0 -= 15 * DAY; x1 += 15 * DAY; }
  const ticks = niceTicks(Math.min.apply(null, all.map(p => p.y)), Math.max.apply(null, all.map(p => p.y)), 3);
  const ymin = ticks[0], ymax = ticks[ticks.length - 1];
  const sx = x => Lm + (x - x0) / (x1 - x0) * (Wd - Lm - Rm);
  const sy = y => T + (1 - (y - ymin) / ((ymax - ymin) || 1)) * (H - T - B);

const BK_COLLS = [['animals', 'animals', 'animal', 'animales'], ['lots', 'lots', 'lote', 'lotes'], ['sales', 'sales', 'venta', 'ventas'], ['people', 'people', 'persona', 'personas'],
  ['milk', 'milk', 'registro de leche', 'registros de leche'], ['notes', 'notes', 'nota', 'notas'], ['avaluos', 'deals', 'avalúo', 'avalúos'], ['paddocks', 'paddocks', 'potrero', 'potreros'],

  ['plans', 'plans', 'plan de alimentación', 'planes de alimentación'], ['workers', 'workers', 'trabajador', 'trabajadores']];
const bkRows = c => (S[c[1]] || []).filter(r => r && r.id);

// una foto de la finca como imagen chica (máx. 1024 px) lista para guardar en el archivo
function bkPhoto(id){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const k = Math.min(1, 1024 / Math.max(im.naturalWidth || 1, im.naturalHeight || 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.7));
      } catch(e){ res(null); }
    };
    im.onerror = () => res(null);
    im.src = '/_blob/' + id;
  });
}
const bkLines = (counts, nph) => {
  const li = t => '<li>' + t + '</li>';
  return '<ul class="bk-list">' + BK_COLLS.filter(c => counts[c[0]] > 0).map(c => li(counts[c[0]] + ' ' + (counts[c[0]] === 1 ? c[2] : c[3]))).join('') + (nph > 0 ? li(nph + ' ' + (nph === 1 ? 'foto' : 'fotos')) : '') + '</ul>';
};
function openBackup(){
  if(!S.downloads || !S.farm || !isAdmin()) return;
  if(!bkTotal()){ toast('Todavía no hay nada que guardar.'); return; }
  const counts = {}; BK_COLLS.forEach(c => { counts[c[0]] = bkRows(c).length; });
  openSheet('Copia de seguridad',
    '<p>Se guarda un archivo en este dispositivo con todo lo de «' + esc(S.farm.name) + '»: ganado, leche, notas, potreros y las fotos.</p>' +
    '<p class="muted" style="margin-top:8px">Guárdalo en un lugar seguro (por ejemplo, mándatelo por correo o súbelo a tu nube). Con ese archivo se puede pasar todo a otra app de Mi Finca.</p>' +
    bkLines(counts, bkPhotoIds().length),
    async (fd, setLabel) => {
      const ids = bkPhotoIds(), photos = {}; let miss = 0;
      for(let i = 0; i < ids.length; i++){
        setLabel('Preparando las fotos… ' + (i + 1) + ' de ' + ids.length);
        let u = null; try { u = await bkPhoto(ids[i]); } catch(e){}
        if(u) photos[ids[i]] = u; else miss++;
      }
      setLabel('Guardando…');
      const data = {}; BK_COLLS.forEach(c => { data[c[0]] = bkRows(c).map(r => JSON.parse(JSON.stringify(r))); });
      const out = { app: 'mi-finca-copia', v: 1, at: Date.now(), finca: { name: S.farm.name, place: S.farm.place || '' }, data, config: S.config && S.config.sale ? { sale: S.config.sale } : null, photos };
      const slug = String(S.farm.name || 'finca').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'finca';
      try { await S.downloads.save({ filename: 'mi-finca-copia-' + slug + '-' + today() + '.json', data: JSON.stringify(out) }); }
      catch(e){ return e && e.code === 'declined' ? 'No se guardó el archivo. Toca «Guardar la copia» para intentar de nuevo.' : 'No se pudo guardar el archivo en este dispositivo.'; }
      toast(miss ? 'Copia guardada. No se pudieron incluir ' + miss + (miss === 1 ? ' foto.' : ' fotos.') : 'Copia guardada');
      return null;
    }, { submit: 'Guardar la copia' });
}

/* pestaña Lotes */

  const pill = s.n === 0 ? '<span class="pill">Sin animales</span>' : done ? '<span class="pill good">Todo vendido</span>' : '<span class="pill">' + plural(s.active, 'cabeza', 'cabezas') + '</span>';
  const sub = [l.buyDate ? 'Compra ' + fmtDate(l.buyDate, true) : '', l.seller || ''].filter(Boolean).join(' · ');
  return '<a class="lotcard" href="#lote-' + esc(l.id) + '"><div class="lc-top"><span class="lotchip">' + esc(l.name) + '</span><span class="pills">' + pill + purpPills(lotAnimals(l.id)) + '</span></div>' +

    '<div class="lc-fin"><span><i>Invertido</i><b>' + fmtMoney(s.invested) + '</b></span><span><i>Vendido</i><b>' + (s.sold ? fmtMoney(s.revenue) : '—') + '</b></span></div></a>';

function homeLots(){
  if(!S.lots.length) return '<div class="empty"><h2>Sin lotes todavía</h2><p>Si compras varios animales juntos, regístralos como un lote para venderlos y llevar las cuentas del grupo.</p>' + W('<button type="button" class="btn primary" data-act="new-lot">' + icon('plus') + ' Comprar un lote</button>') + '</div>';
  const rows = S.lots.map(l => ({ l, s: lotStats(lotAnimals(l.id)) })).sort((x, y) => ((y.s.active > 0) - (x.s.active > 0)) || ((y.l.createdAt || 0) - (x.l.createdAt || 0)));

function lotRes(l, t){
  const as = lotAnimals(l.id), s = lotStats(as), act = as.filter(a => stOf(a) === 'activo'), todos = lotTodos(l.id, t);
  let h = todos.length ? '<div class="todos">' + todos.map(lotTodoHTML).join('') + '</div>' : '';
  const partial = s.active > 0, bal = s.balance;
  h += '<section class="ledger tri" aria-label="Cuentas del lote"><div><span class="k">Invertido</span>' + triV(fmtMoney(s.invested)) + '</div>' +
    '<div><span class="k">Vendido</span>' + triV(s.sold ? fmtMoney(s.revenue) : '—') + '</div>' +
    '<div><span class="k">' + (partial ? 'Balance hasta hoy' : 'Ganancia') + '</span>' + triV(s.sold ? (bal >= 0 ? '+' : '') + fmtMoney(bal) : '—', s.sold ? (bal >= 0 ? 'pos' : 'neg') : 'muted') + '</div></section>';
  if(!s.sold) h += '<p class="note small">Todavía no se ha vendido nada de este lote.</p>';
  else if(partial) h += '<p class="note small">Quedan ' + plural(s.active, 'cabeza', 'cabezas') + ' por vender, con ' + fmtMoney(s.activeCost) + ' invertidos en ellas. El balance cuenta todo lo invertido en el lote.</p>';
  const ws = act.map(a => estimate(a, t)).filter(Boolean).map(e => e.weight), tw = ws.reduce((x, y) => x + y, 0);
  const ages = act.map(a => ageDays(a, t)).filter(d => d != null && d >= 0);
  const cs = as.map(costs), sum = k => cs.reduce((x, c) => x + c[k], 0);
  const rows = [['En el lote', plural(s.active, 'cabeza', 'cabezas')], ['Vendidas', String(s.sold)]];
  if(s.baja) rows.push(['Bajas', String(s.baja)]);
  rows.push(['Compra', fmtMoney(sum('buy'))], ['Vacunas y medicinas', fmtMoney(sum('vac'))], ['Alimento y otros gastos', fmtMoney(sum('exp'))]);
  if(ws.length) { rows.push(['Peso estimado', '≈ ' + fmtN0(tw) + ' kg']); rows.push(['Promedio por cabeza', '≈ ' + fmtN0(tw / ws.length) + ' kg']); }
  if(ages.length) rows.push(['Edad promedio', plural(Math.round(ages.reduce((x, y) => x + y, 0) / ages.length / 30.4375), 'mes', 'meses')]);
  h += '<h3 class="sec">Estado</h3><dl class="kv">' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
  if(l.notes) h += '<p class="d-notes">' + esc(l.notes) + '</p>';
  return h;
}

function lotHist(l){
  const evs = (l.events || []).slice();
  lotAnimals(l.id).forEach(a => { if(stOf(a) === 'vendido' && a.sale && !a.sale.saleId) evs.push({ id: 'i-' + a.id, ts: 0, date: a.sale.date || '', type: 'individual', text: 'Venta de ' + nameOf(a), amount: a.sale.price }); });

  if(!evs.length) return '<p class="muted" style="margin-top:20px">Aún no hay movimientos.</p>';
  const undo = { venta: 'Deshacer', gasto: 'Quitar', vacuna: 'Quitar', chequeo: 'Quitar' };
  return '<h3 class="sec">Historial del lote</h3><ul class="ev">' + evs.map(e => {
    let extra = '';
    if(e.type === 'venta'){
      const s = S.sales.find(x => x.id === e.saleId);
      if(s) extra = (s.groups || []).map(gr => '<div class="n">' + esc((gr.label ? gr.label + ': ' : '') + plural(gr.count, 'cabeza', 'cabezas') + (gr.kg ? ' · ' + fmtN0(gr.kg) + ' kg' : '') + (gr.ppk ? ' · ' + fmtMoney(gr.ppk) + ' por kilo' : '') + ' = ' + fmtMoney(gr.total)) + '</div>').join('');

/* resultados por periodo (pestaña Resumen) */
const REP_LABEL = { '12m': 'Últimos 12 meses', ano: 'Este año', trim: 'Este trimestre', todo: 'Todo el historial', custom: 'Fechas exactas' };
const GRAN_LABEL = { mes: 'Mes', trimestre: 'Trimestre', anio: 'Año' };
const MES_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], MES_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let MES = LANG === 'en' ? MES_EN : MES_ES;
function bucketLabel(b, gran, first){
  const y = b.start.slice(2, 4), m = +b.start.slice(5, 7);
  if(gran === 'anio') return b.start.slice(0, 4);
  if(gran === 'trimestre') return (LANG === 'en' ? 'Q' : 'T') + Math.ceil(m / 3) + ' ' + y;
  return MES[m - 1] + (m === 1 || first ? ' ' + y : '');
}
const bucketFull = (b, gran) => gran === 'anio' ? b.start.slice(0, 4) : gran === 'trimestre' ? (LANG === 'en' ? 'Q' : 'T') + Math.ceil(+b.start.slice(5, 7) / 3) + ' ' + b.start.slice(0, 4) : MES[+b.start.slice(5, 7) - 1] + ' ' + b.start.slice(0, 4);
function repRange(t){
  const r = S.rep; let from, to = t;
  if(r.preset === 'ano') from = t.slice(0, 4) + '-01-01';
  else if(r.preset === 'trim'){ const q = Math.floor((+t.slice(5, 7) - 1) / 3) * 3 + 1; from = t.slice(0, 4) + '-' + String(q).padStart(2, '0') + '-01'; }
  else if(r.preset === 'todo'){ const ds = cashEvents(S.animals).map(e => e.date).sort(); from = ds.length ? ds[0] : t; if(ds.length && ds[ds.length - 1] > t) to = ds[ds.length - 1]; }
  else if(r.preset === 'custom'){ from = r.from || t; to = r.to || t; if(from > to){ const x = from; from = to; to = x; } }
  else from = addMonths(t.slice(0, 7) + '-01', -11);
  let gran = r.gran;
  while(gran !== 'anio' && makeBuckets(from, to, gran).length > 36) gran = gran === 'mes' ? 'trimestre' : 'anio';
  return { from, to, gran, auto: gran !== r.gran };
}
function barChartSVG(bk, gran){
  const Wd = 360, H = 212, Lm = 44, Rm = 6, T = 10, Bm = 28, f = n => n.toFixed(1);
  const maxV = Math.max.apply(null, bk.map(x => Math.max(x.inn, x.out)).concat([1]));
  const ticks = niceTicks(0, maxV, 4), ymax = ticks[ticks.length - 1] || 1;
  const sy = v => T + (1 - v / ymax) * (H - T - Bm), base = sy(0);
  const gw = (Wd - Lm - Rm) / bk.length, bw = Math.max(3, Math.min(16, gw * 0.36)), every = Math.max(1, Math.ceil(34 / gw));
  let s = '';
  ticks.forEach(v => { s += '<line class="gl" x1="' + Lm + '" x2="' + (Wd - Rm) + '" y1="' + f(sy(v)) + '" y2="' + f(sy(v)) + '"/><text class="yl" x="' + (Lm - 6) + '" y="' + f(sy(v) + 4) + '" text-anchor="end">' + esc(fmtCompact(v)) + '</text>'; });
  bk.forEach((x, i) => {
    const cx = Lm + gw * (i + 0.5);
    if(x.out > 0) s += '<rect class="b-out" x="' + f(cx - bw - 1) + '" y="' + f(sy(x.out)) + '" width="' + f(bw) + '" height="' + f(base - sy(x.out)) + '" rx="2"/>';
    if(x.inn > 0) s += '<rect class="b-in" x="' + f(cx + 1) + '" y="' + f(sy(x.inn)) + '" width="' + f(bw) + '" height="' + f(base - sy(x.inn)) + '" rx="2"/>';
    if(i % every === 0) s += '<text class="xl" x="' + f(cx) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(bucketLabel(x, gran, i === 0)) + '</text>';
  });
  return '<svg class="ch" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Gráfica de lo invertido y lo vendido por periodo">' + s + '</svg>';
}
function resultsHTML(t){
  const r = repRange(t), ag = aggregate(S.animals, r.from, r.to, r.gran);
  const gb = g => '<button type="button" data-act="rep-gran" data-g="' + g + '" aria-pressed="' + (S.rep.gran === g) + '">' + GRAN_LABEL[g] + '</button>';
  const label = S.rep.preset === 'custom' ? fmtDate(r.from, true) + ' a ' + fmtDate(r.to, true) : REP_LABEL[S.rep.preset];
  let h = '<h3 class="sec">Resultados</h3><div class="seg" style="margin-top:0" role="group" aria-label="Agrupar por">' + gb('mes') + gb('trimestre') + gb('anio') + '</div>' +
    '<button type="button" class="btn wide period" data-act="rep-period"><span>' + esc(label) + '</span><span aria-hidden="true">▾</span></button>';
  if(r.auto) h += '<p class="note small">Se agrupó por ' + GRAN_LABEL[r.gran].toLowerCase() + ' porque el periodo es largo.</p>';
  h += '<section class="ledger tri" aria-label="Resultados del periodo"><div><span class="k">Invertido</span>' + triV(fmtMoney(ag.out)) + '</div><div><span class="k">Vendido</span>' + triV(fmtMoney(ag.inn)) + '</div>' +
    '<div><span class="k">Ganancia</span>' + triV(ag.sold || ag.profit ? (ag.profit >= 0 ? '+' : '') + fmtMoney(ag.profit) : '—', ag.sold || ag.profit ? (ag.profit >= 0 ? 'pos' : 'neg') : 'muted') + '</div></section>';
  h += '<p class="note small">Invertido es lo que pagaste en compras, gastos y vacunas en el periodo. Ganancia es lo vendido menos todo lo invertido en esos animales.</p>';
  if(!ag.inn && !ag.out) return h + '<p class="muted" style="margin-top:14px">No hay compras, gastos ni ventas en este periodo.</p>';
  h += barChartSVG(ag.buckets, r.gran) + '<div class="legend"><span><i class="sw sw-out"></i>Invertido</span><span><i class="sw sw-in"></i>Vendido</span></div>';
  h += '<details class="dtl"><summary>Ver el detalle por periodo</summary><div style="overflow-x:auto"><table class="tbl dt"><thead><tr><th>Periodo</th><th>Invertido</th><th>Vendido</th></tr></thead><tbody>' +
    ag.buckets.map(b => '<tr><td>' + esc(bucketFull(b, r.gran)) + '</td><td>' + fmtMoney(b.out) + '</td><td>' + fmtMoney(b.inn) + '</td></tr>').join('') + '</tbody></table></div></details>';
  return h;
}

/* ---------- lotes: formularios ---------- */
function syncTrio(block, src){
  const q = block.querySelector('[data-f="q"]'), u = block.querySelector('[data-f="u"]'), t = block.querySelector('[data-f="t"]');
  if(!q || !u || !t) return;
  if(src === 'u') block.dataset.mode = 'u'; else if(src === 't') block.dataset.mode = 't';
  const k = Math.pow(10, +block.dataset.dec || 0), nq = numF(q), nu = numF(u), nt = numF(t);
  if((block.dataset.mode || 'u') === 'u'){ if(nq != null && nq > 0 && nu != null) setF(t, Math.round(nq * nu * k) / k); }
  else if(nq != null && nq > 0 && nt != null) setF(u, Math.round(nt / nq * k) / k);
}

/* comprar un lote */
function openLotForm(){
  const body = fld('f-lname', 'Nombre del lote', inp('f-lname', 'lname', 'text', suggestLotName())) +
    fld('f-ldate', 'Fecha de compra', inp('f-ldate', 'ldate', 'date', today())) + ppField('Vendedor', 'lseller', '', null) +
    '<div data-trio data-mode="u">' + fld('f-lq', 'Cabezas', numInp('f-lq', 'lq', '', 'data-f="q" inputmode="numeric"')) +
    '<div class="two">' + fld('f-lu', 'Precio por cabeza ($)', moneyInp('f-lu', 'lu', '', 'data-f="u" inputmode="numeric"')) + fld('f-lt', 'Precio total ($)', moneyInp('f-lt', 'lt', '', 'data-f="t" inputmode="numeric"')) + '</div>' +
    '<p class="hint" style="margin:-6px 0 14px">Escribe uno de los dos precios y el otro se calcula solo.</p></div>' +
    '<div class="two">' + fld('f-lw', 'Peso promedio (kg)', numInp('f-lw', 'lw', ''), 'Opcional.') + fld('f-lage', 'Edad promedio (meses)', numInp('f-lage', 'lage', '', 'inputmode="numeric"'), 'Opcional.') + '</div>' +
    '<div class="fld"><span class="lbl">Sexo</span>' + radios('lsex', [['M', 'Machos'], ['H', 'Hembras']], 'M') + '</div>' +
    breedField('f-lbreed', 'lbreed', '') +
    purposeField('', '¿Para qué compraste este lote?') +
    fld('f-lnotes', 'Notas', '<textarea id="f-lnotes" name="lnotes"></textarea>') +
    '<p class="note small">Se crea un animal por cada cabeza, con el precio repartido en partes iguales. Después puedes editar el arete de cada uno.</p>';
  openSheet('Comprar un lote', body, async (fd, busy) => {
    const name = g(fd, 'lname'), date = g(fd, 'ldate') || today(), n = Math.round(num(g(fd, 'lq')) || 0);
    if(!name) return 'Ponle un nombre al lote.';
    if(S.lots.some(l => norm(l.name) === norm(name))) return 'Ya existe un lote con ese nombre. Escribe otro.';
    if(!(n >= 1 && n <= 200)) return 'Escribe cuántos animales trae el lote (entre 1 y 200).';
    let total = num(g(fd, 'lt')); const per = num(g(fd, 'lu'));
    if(total == null && per != null) total = Math.round(per * n);
    if(total != null && total < 0) return 'Revisa el precio.';
    const avgW = num(g(fd, 'lw')), ageM = num(g(fd, 'lage'));
    if(avgW != null && (avgW <= 0 || avgW > 1500)) return 'Revisa el peso promedio: debe estar entre 1 y 1.500 kg.';
    if(!guard()) return 'No tienes permiso para editar.';
    const sp = ppRead(fd, 'lseller'), seller = sp.name, sex = g(fd, 'lsex') || 'M', breed = g(fd, 'lbreed'), shares = total != null && total > 0 ? splitInt(total, n) : null, code = lotCode(name);
    const birth = ageM != null && ageM >= 0 && ageM < 400 ? addMonths(date, -Math.round(ageM)) : null, lotId = uid('l');
    busy('Creando…');
    await S.db.collection('lots').doc(lotId).set({ name, purpose: g(fd, 'purpose'), buyDate: date, seller, sellerId: sp.id, headcount: n, buyTotal: total, sex, breed, notes: g(fd, 'lnotes'), createdAt: Date.now(), merges: [],
      events: [mkEv('compra', 'Compra de ' + plural(n, 'cabeza', 'cabezas') + (seller ? ' a ' + seller : ''), total, date)] });
    const idx = Array.from({ length: n }, (_, i) => i);
    await pool(idx, i => S.db.collection('animals').doc(uid('a') + i.toString(36)).set({
      tag: code + '-' + String(i + 1).padStart(2, '0'), name: '', sex, breed, origin: 'comprado', birthDate: birth, birthApprox: !!birth, mother: '', seller,
      buyPrice: shares ? shares[i] : null, buyDate: date, lotId, originLot: name, status: 'activo', notes: '', sale: null, exit: null, createdAt: Date.now() + i,
      checks: avgW != null ? [{ id: uid('c') + i.toString(36), date, weight: avgW, bcs: null, photo: null, notes: 'Peso promedio al comprar', initial: true }] : [], vaccines: [], expenses: [] }), 4);
    S.tab = 'lotes'; closeSheet(); location.hash = 'lote-' + lotId; toast('Lote creado con ' + plural(n, 'animal', 'animales'));
  }, { submit: 'Crear lote' });
}

function updateSaleSum(){

  const pn = $('#pick-n'); if(pn) pn.textContent = '(' + picked + ' de ' + all.length + ')';
  const blocks = Array.from(document.querySelectorAll('#gps .gp')), multi = blocks.length > 1;
  let kg = 0, kgAll = true, total = 0, cnt = 0;

function personBy(id, fallback, from){
  const p = personOf(id);
  return p ? '<a class="plink" href="#persona-' + esc(p.id) + '" data-from="' + esc(from) + '">' + esc(pFull(p)) + '</a>' : esc(fallback || '');
}
function lotSubHTML(l){
  const parts = [];
  if(l.buyDate) parts.push(esc('Compra ' + fmtDate(l.buyDate, true)));
  const s = personBy(l.sellerId, l.seller, 'lote-' + l.id); if(s) parts.push(s);
  return parts.join(' · ');
}

/* lo que cada persona me vendió (compras) y me compró (ventas) */
function personStats(){
  const m = {}, g2 = id => m[id] || (m[id] = { buy: [], sell: [] });
  S.lots.forEach(l => { if(l.sellerId) g2(l.sellerId).buy.push({ date: l.buyDate, text: l.name + ' · ' + plural(l.headcount || lotAnimals(l.id).length, 'cabeza', 'cabezas'), amount: l.buyTotal || 0, href: '#lote-' + l.id }); });
  S.animals.forEach(a => {
    if(a.sellerId && !lotOf(a.lotId)) g2(a.sellerId).buy.push({ date: buyDateOf(a), text: nameOf(a), amount: a.buyPrice || 0, href: '#animal-' + a.id });
    if(a.sale && a.sale.buyerId && !a.sale.saleId) g2(a.sale.buyerId).sell.push({ date: a.sale.date, text: nameOf(a), amount: a.sale.price || 0, href: '#animal-' + a.id });
  });
  S.sales.forEach(s => { if(s.buyerId){ const l = lotOf(s.lotId); g2(s.buyerId).sell.push({ date: s.date, text: plural(s.count || 0, 'cabeza', 'cabezas') + (l ? ' del ' + l.name : s.lotName ? ' del ' + s.lotName : ''), amount: s.totalPrice || 0, href: l ? '#lote-' + l.id : null }); } });
  return m;
}

/* validar y guardar */
function validatePerson(r, selfId){
  const key = docKey(r.docType, r.doc);
  if(!key) return 'Escribe el número de documento.';
  if(key.length < 5) return 'El número de documento parece muy corto. Revísalo.';
  if(key.length > 15) return 'El número de documento parece muy largo. Revísalo.';
  if(!r.firstName) return r.docType === 'NIT' ? 'Escribe el nombre o la razón social.' : 'Escribe el nombre.';
  if(r.docType !== 'NIT' && !r.lastName) return 'Escribe los apellidos.';
  if(r.email && !validEmail(r.email)) return 'El correo no parece válido. Revisa que tenga @ y un punto.';
  if(r.phone && r.phone.replace(/\D/g, '').length < 7) return 'Revisa el número de celular.';
  const dup = S.people.find(x => x.id !== selfId && docKey(x.docType || 'CC', x.doc) === key);
  if(dup) return 'Ese documento ya está registrado a nombre de ' + pFull(dup) + '.';
  return null;
}
function openPersonForm(p, pre){
  const v = p || {}, type = v.docType || 'CC', nit = type === 'NIT';
  const isDoc = pre && /^[\d.\-\s]+$/.test(pre), pf = pre ? (isDoc ? { doc: pre.replace(/\D/g, '') } : splitName(pre)) : {};
  const body =
    fld('f-ptype', 'Tipo de documento', '<select id="f-ptype" name="ptype">' + DOCS.map(d => '<option value="' + d[0] + '"' + (d[0] === type ? ' selected' : '') + '>' + d[1] + '</option>').join('') + '</select>') +
    fld('f-pdoc', 'Número de documento ' + REQ, inp('f-pdoc', 'pdoc', 'text', fmtDocLive(type, v.doc || pf.doc || ''), 'data-doc="type" inputmode="' + (type === 'PA' ? 'text' : 'numeric') + '"'), 'Escríbelo solo con números: los puntos se ponen solos.') +
    '<div class="two">' + fld('f-pfirst', '<span id="lbl-pfirst">' + (nit ? 'Nombre o razón social' : 'Nombres') + '</span> ' + REQ, inp('f-pfirst', 'pfirst', 'text', v.firstName || pf.first || '', 'autocapitalize="words"')) +
    fld('f-plast', 'Apellidos <span class="req" id="req-plast"' + (nit ? ' hidden' : '') + '>Obligatorio</span>', inp('f-plast', 'plast', 'text', v.lastName || pf.last || '', 'autocapitalize="words"')) + '</div>' +
    fld('f-pphone', 'Celular', inp('f-pphone', 'pphone', 'text', v.phone, 'inputmode="tel"'), 'Opcional.') +
    fld('f-pemail', 'Correo electrónico', inp('f-pemail', 'pemail', 'text', v.email, 'inputmode="email" autocapitalize="none"'), 'Opcional.') +
    fld('f-paddr', 'Dirección', inp('f-paddr', 'paddr', 'text', v.address, 'autocapitalize="sentences"'), 'Opcional. Vereda, finca, barrio, municipio…') +
    fld('f-pnotes', 'Notas', '<textarea id="f-pnotes" name="pnotes">' + esc(v.notes) + '</textarea>');
  openSheet(p ? 'Editar persona' : 'Agregar persona', body, async fd => {
    const t = g(fd, 'ptype') || 'CC';
    const rec = { docType: t, doc: normDoc(t, g(fd, 'pdoc')), firstName: g(fd, 'pfirst'), lastName: g(fd, 'plast'), phone: g(fd, 'pphone'), email: g(fd, 'pemail'), address: g(fd, 'paddr'), notes: g(fd, 'pnotes') };
    const err = validatePerson(rec, p && p.id); if(err) return err;

    if(p) await mutateIn('people', p.id, d => { Object.assign(d, rec); });
    else { await S.db.collection('people').doc(uid('p')).set(Object.assign({ createdAt: Date.now() }, rec)); S.tab = 'personas'; S.pq = ''; }
    toast(p ? 'Persona guardada' : 'Persona agregada');
  }, { submit: p ? 'Guardar' : 'Agregar persona', deleteLabel: 'Eliminar persona',
    onDelete: p && S.canWrite ? async () => { if(!guard()) return; await S.db.collection('people').doc(p.id).delete(); closeSheet(); location.hash = 'inicio'; toast('Persona eliminada'); } : null });
}

async function ppSave(box, btn){
  const nw = box.querySelector('.pp-new'), val = k => (nw.querySelector('[data-k="' + k + '"]').value || '').trim(), err = nw.querySelector('.err');
  const t = val('type') || 'CC', rec = { docType: t, doc: normDoc(t, val('doc')), firstName: val('first'), lastName: val('last'), phone: val('phone'), email: '', address: '', notes: '' };
  const key = docKey(t, rec.doc), dup = key ? S.people.find(x => docKey(x.docType || 'CC', x.doc) === key) : null;
  if(dup){ ppPick(box, dup); toast('Ese documento ya estaba registrado. Se eligió a ' + pFull(dup) + '.'); return; }
  const msg = validatePerson(rec, null);
  if(msg){ err.textContent = msg; err.hidden = false; return; }
  if(!guard()) return;
  btn.disabled = true; err.hidden = true;
  try {
    const id = uid('p'), doc = Object.assign({ createdAt: Date.now() }, rec);
    await S.db.collection('people').doc(id).set(doc);
    const person = Object.assign({ id }, doc); ppCache[id] = person; ppPick(box, person); toast('Persona guardada');
  } catch(e){ btn.disabled = false; err.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.'; err.hidden = false; }
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest && ev.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, box = el.closest('.pp');
  switch(act){
    case 'new-person': if(guard()){ closeSheet(); openPersonForm(null, el.dataset.q || ''); } break;
    case 'person-edit': { const p = routePerson() ? personOf(routePerson()) : null; if(p && guard()) openPersonForm(p); break; }
    case 'pp-pick': if(box){ const p = personOf(el.dataset.id); if(p) ppPick(box, p); } break;
    case 'pp-new': if(box) ppOpenNew(box); break;
    case 'pp-cancel': if(box){ const nw = box.querySelector('.pp-new'); nw.hidden = true; nw.innerHTML = ''; ppList(box); } break;
    case 'pp-save': if(box) ppSave(box, el); break;
    case 'copy': try { await navigator.clipboard.writeText(el.dataset.v || ''); toast('Copiado'); } catch(e){ toast('No se pudo copiar. Mantén presionado el texto para copiarlo.'); } break;
  }
});
document.addEventListener('input', ev => { const t = ev.target; if(t && t.classList && t.classList.contains('pp-q')) ppInput(t.closest('.pp')); });
document.addEventListener('focusin', ev => { const t = ev.target; if(t && t.classList && t.classList.contains('pp-q')) ppList(t.closest('.pp')); });
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter') return;
  const t = ev.target; if(!t || !t.closest) return;
  const box = t.closest('.pp'); if(!box) return;
  if(t.closest('.pp-new')){ ev.preventDefault(); const b = box.querySelector('[data-act="pp-save"]'); if(b) b.click(); }
  else if(t.classList.contains('pp-q') && !box.querySelector('input[type="hidden"]').value && box.querySelector('.pp-list [data-act="pp-pick"]')) ev.preventDefault();
});
document.addEventListener('change', ev => {
  const t = ev.target; if(!t || t.name !== 'ptype') return;
  const d = $('#f-pdoc'); if(d){ d.inputMode = t.value === 'PA' ? 'text' : 'numeric'; liveFormat(d); }

/* ---------- leche diaria ---------- */
const fmtDay = s => new Date(parseD(s)).toLocaleDateString(DLOC(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
function milkChartSVG(t){
  const days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13)), by = {};
  S.milk.forEach(r => { by[r.date] = milkTotal(r); });
  const vals = days.map(d => by[d] || 0), Wd = 360, H = 190, Lm = 38, Rm = 6, T = 10, Bm = 26, f = n => n.toFixed(1);
  const ticks = niceTicks(0, Math.max.apply(null, vals.concat([1])), 4), ymax = ticks[ticks.length - 1] || 1;
  const sy = v => T + (1 - v / ymax) * (H - T - Bm), base = sy(0), gw = (Wd - Lm - Rm) / 14, bw = Math.min(16, gw * 0.62);
  let s = '';
  ticks.forEach(v => { s += '<line class="gl" x1="' + Lm + '" x2="' + (Wd - Rm) + '" y1="' + f(sy(v)) + '" y2="' + f(sy(v)) + '"/><text class="yl" x="' + (Lm - 6) + '" y="' + f(sy(v) + 4) + '" text-anchor="end">' + esc(fmtN0(v)) + '</text>'; });
  days.forEach((d, i) => {
    const cx = Lm + gw * (i + 0.5);
    if(vals[i] > 0) s += '<rect class="b-in" x="' + f(cx - bw / 2) + '" y="' + f(sy(vals[i])) + '" width="' + f(bw) + '" height="' + f(base - sy(vals[i])) + '" rx="2"/>';
    if((13 - i) % 2 === 0) s += '<text class="xl" x="' + f(cx) + '" y="' + (H - 8) + '" text-anchor="middle">' + (+d.slice(8)) + '</text>';
  });
  return '<svg class="ch" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Litros de leche por día en los últimos 14 días">' + s + '</svg>';
}
function milkParts(r){
  const p = [];
  if(r.am != null && r.am !== '') p.push('Mañana ' + fmtN1(r.am));
  if(r.pm != null && r.pm !== '') p.push('Tarde ' + fmtN1(r.pm));
  if(r.cows) p.push(plural(r.cows, 'vaca', 'vacas'));
  if(r.price) p.push(fmtMoney(r.price) + '/L');
  return p;
}
function homeMilk(t){
  const rows = S.milk.slice().sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : 0), cur = S.milk.find(r => r.date === t);
  if(!rows.length) return '<div class="empty"><h2>Control de leche</h2><p>Anota cada día los litros de la mañana y de la tarde. Aquí ves el total del día, el promedio y cómo va el mes.</p>' + W('<button type="button" class="btn primary" data-act="milk-add">' + icon('plus') + ' Registrar el ordeño de hoy</button>') + '</div>';
  const w = milkSum(S.milk, addDays(t, -6), t), m = milkSum(S.milk, t.slice(0, 7) + '-01', t), vacas = S.animals.filter(a => stOf(a) === 'activo' && purposeOf(a) === 'leche').length;
  let h = '<section class="mhero"><span class="k">Hoy · ' + esc(fmtDay(t)) + '</span>';
  if(cur) h += '<div class="big"><span class="num">' + fmtN1(milkTotal(cur)) + '</span><span class="u">litros</span></div><p class="sub">' + esc(milkParts(cur).join(' · ')) + '</p>' + W('<button type="button" class="btn sm" data-act="milk-edit" data-id="' + esc(cur.id) + '">' + icon('edit') + ' Editar lo de hoy</button>');
  else h += '<div class="big"><span class="num muted">—</span></div><p class="sub">Todavía no registras el ordeño de hoy.</p>' + W('<button type="button" class="btn primary" data-act="milk-add">' + icon('plus') + ' Registrar el ordeño de hoy</button>');
  h += '</section>';
  if(vacas) h += '<p class="note small">' + plural(vacas, 'vaca lechera', 'vacas lecheras') + ' en tu ganado.</p>';
  h += '<section class="ledger" aria-label="Resumen de leche"><div><span class="k">Últimos 7 días</span>' + bigV(fmtN0(w.liters) + ' L') + '</div><div><span class="k">Promedio por día</span>' + bigV(w.days ? fmtN1(w.liters / w.days) + ' L' : '—') + '</div>' +

/* ---------- razas, madre y crías ---------- */
// las vacas lecheras y los toros no se miden con la ventana de venta
const keeps = a => ['leche', 'toro'].indexOf(purposeOf(a)) > -1;
const momLabel = m => m ? (m.name ? (m.tag ? m.name + ' · ' + m.tag : m.name) : (m.tag ? 'Arete ' + m.tag : '')) : '';
let relCache = { src: null, calves: {}, mom: {} };
function relations(){
  if(relCache.src === S.animals) return relCache;
  const byId = {}, byKey = {}, c = { src: S.animals, calves: {}, mom: {} };
  S.animals.forEach(x => { byId[x.id] = x; });
  S.animals.filter(x => x.sex === 'H').forEach(f => { [f.tag, f.name].forEach(k => { const n = norm(k).trim(); if(n) (byKey[n] = byKey[n] || []).push(f); }); });
  S.animals.forEach(x => {
    let m = x.motherId ? byId[x.motherId] : null;
    if(!m && !x.motherId && x.mother){ const hit = byKey[norm(x.mother).trim()]; if(hit && hit.length === 1 && hit[0].id !== x.id) m = hit[0]; }
    if(m && m.id !== x.id){ c.mom[x.id] = m; (c.calves[m.id] = c.calves[m.id] || []).push(x); }
  });
  relCache = c; return c;
}
const momOf = a => relations().mom[a.id] || null;
const calvesOf = m => relations().calves[m.id] || [];
const calfPill = a => a.sex === 'H' && calvesOf(a).length ? '<span class="pill">' + plural(calvesOf(a).length, 'cría', 'crías') + '</span>' : '';

const breedPool = () => { const have = {}; BREEDS.forEach(b => { have[fold(b)] = 1; }); return BREEDS.concat(Object.keys(breedFreq()).filter(b => !have[fold(b)])); };

const fmtDayLong = s => { const x = new Date(parseD(s)).toLocaleDateString(DLOC(), { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); return x.charAt(0).toUpperCase() + x.slice(1); };

  add('Estado', st === 'vendido' ? 'Vendido' + (a.sale && a.sale.date ? ' · ' + esc(fmtDate(a.sale.date, true)) : '') : st === 'baja' ? 'Baja' + (a.exit && a.exit.date ? ' · ' + esc(fmtDate(a.exit.date, true)) : '') : 'Activo');

function setPerms(){

/* la base de datos de una finca: la principal usa donde siempre estuvieron los datos, las demás su propio rincón */
function farmDb(raw, fid){
  const pre = fid === LEGACY_ID ? '' : 'fincas/' + fid + '/';
  return { collection: n => {
    if(GLOBAL_COLL[n]) return raw.collection(n);
    const c = raw.collection(pre + n);
    return {
      onSnapshot: (ok, bad) => c.onSnapshot(ok, bad),
      doc: id => { const d = c.doc(id); return {
        set: x => d.set(S.me ? Object.assign({}, x, { uby: S.me.id, uat: Date.now() }) : x),
        delete: o => (S.canDelete || (o && o.internal)) ? d.delete() : Promise.reject(new Error('Solo el administrador puede borrar.'))
      }; }
    };
  } };
}

/* gráfico de una serie (un punto por mes) con la misma letra y colores del gráfico del animal */
function seriesSVG(pts, label){
  const Wd = 360, H = 190, Lm = 40, Rm = 16, T = 26, B = 30, n = pts.length;
  const ys = pts.map(p => p.y), ticks = niceTicks(Math.min.apply(null, ys), Math.max.apply(null, ys), 3), ymin = ticks[0], ymax = ticks[ticks.length - 1];
  const sx = i => n === 1 ? Lm + (Wd - Lm - Rm) / 2 : Lm + i * (Wd - Lm - Rm) / (n - 1);
  const sy = y => T + (1 - (y - ymin) / ((ymax - ymin) || 1)) * (H - T - B), f = v => v.toFixed(1);
  let s = ticks.map(v => '<line class="gl" x1="' + Lm + '" x2="' + (Wd - Rm) + '" y1="' + f(sy(v)) + '" y2="' + f(sy(v)) + '"/><text class="yl" x="' + (Lm - 6) + '" y="' + f(sy(v) + 4) + '" text-anchor="end">' + fmtN0(v) + '</text>').join('');
  const line = pts.map((p, i) => (i ? 'L' : 'M') + f(sx(i)) + ' ' + f(sy(p.y))).join(' ');
  if(n > 1) s += '<path class="area" d="' + line + ' L' + f(sx(n - 1)) + ' ' + f(sy(ymin)) + ' L' + f(sx(0)) + ' ' + f(sy(ymin)) + ' Z"/><path class="ln" d="' + line + '"/>';
  pts.forEach((p, i) => { s += '<circle class="dot" cx="' + f(sx(i)) + '" cy="' + f(sy(p.y)) + '" r="4.5"/>'; });
  const idx = n <= 3 ? pts.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  idx.forEach(i => { s += '<text class="xl" x="' + f(sx(i)) + '" y="' + (H - 8) + '" text-anchor="' + (n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + esc(pts[i].l) + '</text>'; });
  (n === 1 ? [0] : [0, n - 1]).forEach(i => { s += '<text class="val" x="' + f(sx(i)) + '" y="' + f(sy(pts[i].y) - 10) + '" text-anchor="' + (n === 1 ? 'middle' : i === 0 ? 'start' : 'end') + '">' + fmtN0(pts[i].y) + '</text>'; });
  return '<svg class="ch" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + s + '</svg>';
}

  if(!act.length){ toast('Primero agrega animales al ganado.'); return; }
  const lots = S.lots.filter(l => lotAnimals(l.id).some(isActive)), loose = act.filter(a => !lotOf(a.lotId)).length;
  const scope = '<div class="fld"><label for="w-scope">¿Qué vas a pesar?</label><select id="w-scope" name="scope"><option value="*">Todo el ganado (' + act.length + ')</option>' +
    lots.map(l => '<option value="' + esc(l.id) + '">' + esc(l.name) + ' (' + lotAnimals(l.id).filter(isActive).length + ')</option>').join('') + (lots.length && loose ? '<option value="-">Sin lote (' + loose + ')</option>' : '') + '</select></div>';
  const rows = '<div class="wrows">' + act.map(a => { const l = lastW(a);
    return '<label class="wrow" data-lot="' + esc(lotOf(a.lotId) ? a.lotId : '') + '"><span class="wr-t"><span class="tag">' + esc(a.tag || 'S/N') + '</span><strong>' + esc(a.name || '') + '</strong><small>' + (l ? 'Último ' + fmtN0(l.weight) + ' kg · ' + esc(fmtDate(l.date)) : 'Sin peso aún') + '</small></span>' +
      '<input type="number" inputmode="decimal" step="any" min="0" name="w_' + esc(a.id) + '" placeholder="kg" autocomplete="off" aria-label="Peso de ' + esc(nameOf(a)) + ' en kilos"></label>'; }).join('') + '</div>';
  openSheet('Registrar pesaje', fld('w-date', 'Fecha del pesaje', inp('w-date', 'wdate', 'date', t)) + scope + '<p class="hint" style="margin:-4px 0 10px">Escribe el peso de los que pesaste. Los que dejes vacíos no cambian.</p>' + rows, async fd => {
    const date = g(fd, 'wdate') || t; if(date > t) return 'La fecha del pesaje no puede ser de un día que todavía no llega.';
    const items = [];
    for(const a of act){
      const raw = g(fd, 'w_' + a.id); if(raw === '') continue;
      const w = num(raw); if(w == null || w <= 0 || w > 1500) return 'Revisa el peso de ' + nameOf(a) + ': debe estar entre 1 y 1.500 kg.';
      items.push({ id: a.id, w });
    }
    if(!items.length) return 'Escribe el peso de al menos un animal.';
    if(!guard()) return 'No tienes permiso para editar.';
    await pool(items, it => mutate(it.id, d => {
      d.checks = d.checks || []; const same = d.checks.find(c => c.date === date);
      if(same) same.weight = it.w; else d.checks.push({ id: uid('c'), date, weight: it.w, bcs: null, photo: null, notes: 'Pesaje' });
    }), 4);
    toast('Pesaje guardado: ' + plural(items.length, 'animal', 'animales'));
  }, { submit: 'Guardar pesaje' });
}

function sireChips(){
  const used = {}; S.animals.forEach(a => { if(a.sire) used[a.sire] = 1; });
  const bulls = S.animals.filter(x => x.sex === 'M' && isActive(x) && purposeOf(x) === 'toro').map(x => x.name || ('Arete ' + x.tag));
  const all = []; bulls.concat(Object.keys(used)).forEach(n => { if(n && all.indexOf(n) < 0) all.push(n); });
  return all.slice(0, 6);
}

function resolveMom(fd){
