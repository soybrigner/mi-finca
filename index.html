function openWeanForm(a){
  const t = today(), due = weanDue(S.animals, t), w = a ? weanOf(a) : null;
  let pick = '';
  if(!a){
    const others = S.animals.filter(x => isActive(x) && x.birthDate && !weanOf(x) && !due.some(d => d.a.id === x.id) && daysBetween(x.birthDate, t) >= 0).sort((x, y) => String(x.tag || x.name).localeCompare(String(y.tag || y.name), 'es', { numeric: true }));
    if(!due.length && !others.length){ toast('Para registrar un destete el animal necesita su fecha de nacimiento.'); return; }
    pick = '<div class="fld"><label for="wn-calf">Ternero</label><select id="wn-calf" name="calf">' +
      (due.length ? '<optgroup label="Por destetar">' + due.map(x => '<option value="' + esc(x.a.id) + '">' + esc(weanLabel(x.a) + ' · ' + months1(x.days) + ' meses') + '</option>').join('') + '</optgroup>' : '') +
      (others.length ? '<optgroup label="Otros animales (por si ya lo destetaste antes)">' + others.map(x => '<option value="' + esc(x.id) + '">' + esc(weanLabel(x) + ' · ' + months1(daysBetween(x.birthDate, t)) + ' meses') + '</option>').join('') + '</optgroup>' : '') + '</select></div>';
  }
  const est = a ? estimate(a, t) : null;
  const body = pick + fld('wn-date', 'Fecha del destete', inp('wn-date', 'wdate', 'date', w ? w.date : t)) +
    fld('wn-w', 'Peso del ternero (kg)', numInp('wn-w', 'ww', w && w.weight ? w.weight : (est ? Math.round(est.weight) : '')), 'El peso del día del destete. Con él se compara a las crías.') +
    fld('wn-notes', 'Notas', '<textarea id="wn-notes" name="wnotes">' + esc(w ? w.notes : '') + '</textarea>');
  openSheet(w ? 'Destete de ' + nameOf(a) : a ? 'Destetar a ' + nameOf(a) : 'Registrar destete', body, async fd => {
    const cal = a || S.animals.find(x => x.id === g(fd, 'calf')); if(!cal) return 'Elige el ternero.';
    const date = g(fd, 'wdate') || t, wt = num(g(fd, 'ww'));
    if(date > t) return 'La fecha del destete no puede ser de un día que todavía no llega.';
    if(cal.birthDate && date < cal.birthDate) return 'La fecha del destete no puede ser antes de que naciera.';
    if(wt != null && (wt <= 0 || wt > 1500)) return 'Revisa el peso: debe estar entre 1 y 1.500 kg.';
    if(!guard()) return 'No tienes permiso para editar.';
    await mutate(cal.id, d => {
      d.wean = { date, weight: wt, notes: g(fd, 'wnotes') }; d.checks = d.checks || [];
      const mine = d.checks.find(c => c.notes === 'Peso al destete');
      if(wt != null){ if(mine){ mine.date = date; mine.weight = wt; } else { const same = d.checks.find(c => c.date === date); if(same && same.weight == null) same.weight = wt; else if(!same) d.checks.push({ id: uid('c'), date, weight: wt, bcs: null, photo: null, notes: 'Peso al destete' }); } }
    });
    toast('Destete registrado');
  }, { submit: w ? 'Guardar cambios' : 'Registrar', deleteLabel: 'Quitar el destete',
    onDelete: w ? async () => { if(!guard()) return; await mutate(a.id, d => { delete d.wean; d.checks = (d.checks || []).filter(c => c.notes !== 'Peso al destete'); }); closeSheet(); toast('Destete quitado'); } : null });
}

const SES_KEY = 'mifinca-sesion', PW_ITER = 150000, DUMMY_SALT = 'AAAAAAAAAAAAAAAAAAAAAA==';
let fails = 0, lockUntil = 0;
// si el navegador no puede proteger contraseñas, no se pide ingreso (así nadie se queda sin entrar a su propio ganado)
const gated = () => !!(S.db && !S.noDb && !S.err && !S.me && hasCrypto());
const hasCrypto = () => true;
const accName = a => (String(a.name || '') + ' ' + String(a.last || '')).trim();
const tidy = s => String(s || '').trim().replace(/\s+/g, ' ');
const NOCRYPTO = 'Este navegador no deja crear ni revisar contraseñas de forma segura. Abre la página en Chrome o Safari actualizados.';
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw, salt, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: iter }, key, 256));
}
async function makePw(pw){ const s = b64(crypto.getRandomValues(new Uint8Array(16))); return { s, i: PW_ITER, h: await derive(pw, s, PW_ITER) }; }
async function checkPw(pw, rec){
  if(!rec || !rec.s || !rec.h){ await derive(pw, DUMMY_SALT, PW_ITER); return false; }
  const h = await derive(pw, rec.s, rec.i || PW_ITER); let d = h.length ^ rec.h.length;
  for(let i = 0; i < h.length; i++) d |= h.charCodeAt(i) ^ (rec.h.charCodeAt(i) || 0);
  return d === 0;
}

/* sesión recordada en este celular */
function sessionKeep(){ try { return !!localStorage.getItem(SES_KEY); } catch(e){ return false; } }
function clearSession(){ try { localStorage.removeItem(SES_KEY); } catch(e){} try { sessionStorage.removeItem(SES_KEY); } catch(e){} }
function saveSession(keep){
  const v = JSON.stringify({ id: S.me.id, pwAt: S.me.pwAt || 0 });
  clearSession();
  try { (keep ? localStorage : sessionStorage).setItem(SES_KEY, v); } catch(e){}
}
function readSession(){
  for(const st of ['localStorage', 'sessionStorage']){ try { const v = JSON.parse(window[st].getItem(SES_KEY) || 'null'); if(v && v.id) return v; } catch(e){} }
  return null;
}
function restoreSession(){
  const s = readSession(); if(!s) return;
  const a = S.accounts.find(x => x.id === s.id);
  if(a && (a.pwAt || 0) === (s.pwAt || 0)) S.me = a; else clearSession();
}
function syncSession(){
  if(!S.me) return;
  const a = S.accounts.find(x => x.id === S.me.id);
  if(!a || (a.pwAt || 0) > (S.me.pwAt || 0)){ doLogout(); toast(a ? 'Cambiaron tu contraseña. Ingresa de nuevo.' : 'Esa cuenta ya no existe.'); }
  else if((a.pwAt || 0) === (S.me.pwAt || 0)) S.me = a;
}
function doLogout(){ clearSession(); leaveFarm(); S.me = null; S.auth = ''; S.notice = ''; closeSheet(); render(); window.scrollTo(0, 0); }

/* acciones de la pantalla de ingreso */
async function doLogin(fd, fail){
  if(Date.now() < lockUntil) return fail('Demasiados intentos. Espera ' + Math.ceil((lockUntil - Date.now()) / 1000) + ' segundos.');
  const ident = String(fd.get('ident') || '').trim(), pw = String(fd.get('pw') || '');
  if(!ident) return fail('Escribe tu correo o tu cédula.');
  if(!pw) return fail('Escribe tu contraseña.');
  const acc = findAccount(S.accounts, ident), good = await checkPw(pw, acc && acc.pw);
  if(!acc || !good){
    fails++;
    if(fails >= 5){ fails = 0; lockUntil = Date.now() + 30000; return fail('Demasiados intentos. Espera 30 segundos y vuelve a probar.'); }
    return fail('El correo o la cédula, o la contraseña, no coinciden. Revísalos e intenta de nuevo.');
  }
  fails = 0; S.me = acc; S.auth = ''; S.notice = ''; saveSession(!!fd.get('keep')); afterAuth(); render(); window.scrollTo(0, 0);
}
async function doSignup(fd, fail){
  if(S.platW === false) return fail('Esta página solo está abierta para ver. Pídele al dueño que te dé permiso para editar y así crear tu cuenta.');
  const rec = { name: tidy(fd.get('name')), last: tidy(fd.get('last')), doc: String(fd.get('doc') || ''), email: String(fd.get('email') || '').trim().toLowerCase(), pw: String(fd.get('pw') || ''), pw2: String(fd.get('pw2') || '') };
  const msg = validateSignup(rec, S.accounts); if(msg) return fail(msg);
  const now = Date.now(), id = uid('u'), inv = S.invite ? S.invites.find(x => x.id === S.invite) : null, viaInv = !!inv && inviteState(inv, now) === 'activa';
  const doc = { name: rec.name, last: rec.last, doc: rec.doc.replace(/\D/g, ''), email: rec.email, pw: await makePw(rec.pw), pwAt: now, createdAt: now };
  if(viaInv) doc.invFid = inv.fid;
  await S.raw.collection('accounts').doc(id).set(doc);
  const acc = Object.assign({ id }, doc); if(!S.accounts.some(x => x.id === id)) S.accounts.push(acc);
  S.me = acc; S.auth = ''; saveSession(true); afterAuth(viaInv); window.scrollTo(0, 0); toast('Cuenta creada. ¡Bienvenido, ' + firstOf(rec.name) + '!');
}
async function doOwnerReset(fd, fail){
  if(!S.isOwner) return fail('Solo el dueño de la página puede hacer esto.');
  const acc = findAccount(S.accounts, fd.get('ident')); if(!acc) return fail('No hay ninguna cuenta con ese correo o cédula.');
  const pw = String(fd.get('pw') || ''), msg = validatePw(pw, String(fd.get('pw2') || '')); if(msg) return fail(msg);
  const now = Date.now(), pwRec = await makePw(pw);
  await mutateIn('accounts', acc.id, d => { d.pw = pwRec; d.pwAt = now; });
  S.auth = 'login'; S.notice = 'Listo: guardé la contraseña nueva. Ya puedes ingresar.'; render();
}
document.addEventListener('submit', async ev => {
  const f = ev.target; if(!f || f.id !== 'auth-form') return;
  ev.preventDefault();
  const btn = $('#auth-ok'), err = $('#auth-err'), label = btn.textContent, fd = new FormData(f), m = f.dataset.m;
  const fail = msg => { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = label; };
  err.hidden = true;
  if(!hasCrypto()) return fail(NOCRYPTO);
  btn.disabled = true; btn.textContent = 'Un momento…';
  try { if(m === 'login') await doLogin(fd, fail); else if(m === 'signup') await doSignup(fd, fail); else await doOwnerReset(fd, fail); }
  catch(e){ fail('No se pudo completar. Revisa tu conexión e intenta de nuevo.'); }
});

function openChangePw(){

const moneyInp = (id, name, val, extra) => inp(id, name, 'text', moneyStr(val), 'inputmode="numeric" data-money ' + String(extra || '').replace(/inputmode="[a-z]*"/, ''));
const numF = el => el.hasAttribute('data-money') ? moneyVal(el.value) : num(el.value);
const setF = (el, n) => { el.value = el.hasAttribute('data-money') ? moneyStr(n) : String(n); };
function docTypeFor(el){
  if(el.dataset.doc !== 'type') return 'CC';
  const sel = el.id === 'f-pdoc' ? $('#f-ptype') : (el.closest('.pp-new') ? el.closest('.pp-new').querySelector('[data-k="type"]') : null);
  return (sel && sel.value) || 'CC';
}
function liveFormat(el){
  let fmt = null;
  if(el.hasAttribute('data-money')) fmt = fmtMoneyIn;
  else if(el.dataset.doc === 'ident') fmt = fmtIdentLive;
  else if(el.dataset.doc){ const ty = docTypeFor(el); fmt = v => fmtDocLive(ty, v); }
  if(!fmt) return;
  const old = el.value, pos = el.selectionStart == null ? old.length : el.selectionStart, sig = sigBefore(old, pos), nv = fmt(old);
  if(nv === old) return;
  el.value = nv;
  if(document.activeElement === el && el.setSelectionRange){ const p = caretAfter(nv, sig); try { el.setSelectionRange(p, p); } catch(e){} }
}
// al guardar, los precios viajan sin puntos
function fdOf(form){
  const fd = new FormData(form);
  form.querySelectorAll('[data-money]').forEach(i => { if(i.name) fd.set(i.name, String(moneyVal(i.value) == null ? '' : moneyVal(i.value))); });
  return fd;
}

/* ---------- reproducción: servicio, preñez y parto probable ---------- */
const METHOD = { monta: 'Monta', ia: 'Inseminación' };
const calfDatesOf = a => calvesOf(a).map(c => c.birthDate);
function breedEligible(a, t){
  if(a.sex !== 'H' || stOf(a) !== 'activo') return false;
  if((a.breeding || []).length) return true;
  if(purposeOf(a) === 'ceba') return false;
  const d = ageDays(a, t); return d == null || d / 30.4375 >= 12;
}
const inDays = d => d === 0 ? 'hoy' : d < 0 ? 'hace ' + (-d >= 75 ? '~' + plural(Math.round(-d / 30.4), 'mes', 'meses') : plural(-d, 'día', 'días')) : 'en ' + (d >= 75 ? '~' + plural(Math.round(d / 30.4), 'mes', 'meses') : plural(d, 'día', 'días'));
function breedPill(a, t){
  if(a.sex !== 'H' || !(a.breeding || []).length || stOf(a) !== 'activo') return '';
  const bs = breedState(a, t, calfDatesOf(a)); if(!bs) return '';
  if(bs.state === 'prenada') return bs.daysToDue <= 30 ? '<span class="pill soon">' + (bs.daysToDue < 0 ? 'Parto atrasado' : 'Parto ' + inDays(bs.daysToDue)) + '</span>' : '<span class="pill good">Preñada</span>';
  if(bs.state === 'servida') return '<span class="pill">Servida</span>';
  return '';
}
function secBreed(a, t){
  if(!breedEligible(a, t)) return '';
  const bs = breedState(a, t, calfDatesOf(a));
  if(!bs) return '<h3 class="sec">Reproducción</h3><p class="muted">Cuando la sirvan (monta o inseminación), anótalo aquí y la app calcula el día probable del parto.</p>' +
    W('<div class="sec-actions"><button type="button" class="btn" data-act="breed-add">' + icon('plus') + ' Registrar servicio</button></div>');
  const L = bs.last, st = { prenada: ['good', 'Preñada'], servida: ['', 'Servida · falta confirmar'], vacia: ['warn', 'No quedó preñada'], parida: ['good', 'Ya parió'] }[bs.state];
  let rows = '<dt>Último servicio</dt><dd>' + esc(fmtDate(L.date, true)) + '</dd><dt>Cómo fue</dt><dd>' + esc(METHOD[L.method] || 'Monta') + (L.sire ? ' · ' + esc(L.sire) : '') + '</dd>';
  if(bs.state === 'servida') rows += '<dt>Revisar preñez</dt><dd>' + esc(fmtDate(bs.checkOn, true)) + ' <small class="muted">(' + inDays(bs.daysToCheck) + ')</small></dd>';
  if(bs.state === 'prenada' || bs.state === 'servida') rows += '<dt>' + (bs.state === 'servida' ? 'Parto si quedó preñada' : 'Parto probable') + '</dt><dd><b>' + esc(fmtDate(bs.due, true)) + '</b> <small class="muted">(' + inDays(bs.daysToDue) + ')</small></dd>';
  rows += '<dt>Servicios anotados</dt><dd>' + bs.n + '</dd>';
  let btns = '';
  if(bs.state === 'servida') btns = '<button type="button" class="btn primary" data-act="breed-edit" data-rid="' + esc(L.id) + '">Confirmar si quedó preñada</button>';

const dealOtherName = d => d.partner ? firstOf(d.partner) : (d.role === 'cuidador' ? 'El dueño' : 'El cuidador');
const dealName = d => d.name || (d.partner ? 'Ganado con ' + firstOf(d.partner) : 'Ganado avaluado');

function dealDue(d, t){

}
function sumText(parts){
  return parts.map((p, i) => {
    const neg = p[1] < 0, sep = i ? (neg ? ' − ' : ' + ') : (neg && p[0] !== 'pérdida' ? '−' : '');

  }).join('');

// los dos cuadros «Para ti / Para el otro»: sp = dealSplit(...) o la suma de las ventas
function dealBoxes(d, sp){
  const me = dealMineSide(d), ot = me === 'owner' ? 'care' : 'owner', other = dealOtherName(d);
  const side = s => {
    if(s === 'owner'){
      const p = [['avalúo', sp.capital]]; if(sp.expOwner) p.push(['gastos que pagó', sp.expOwner]); if(sp.expT) p.push(['gastos', sp.expT]); p.push([sp.ownerProfit < 0 ? 'pérdida' : 'ganancia', sp.ownerProfit]); if(sp.owes) p.push(['avalúo de la baja', sp.owes]);
      return sumText(p);
    }
    const p = []; if(sp.expCare) p.push(['gastos que pagó', sp.expCare]); if(sp.expT) p.push(['gastos', -sp.expT]); p.push([sp.careProfit < 0 ? 'pérdida' : 'ganancia', sp.careProfit]); if(sp.owes) p.push(['avalúo de la baja', -sp.owes]);
    return sumText(p);
  };
  const box = (s, who, cls) => '<div class="' + cls + '"><i>Para ' + esc(who) + '</i><b' + (sp[s] < 0 ? ' class="neg"' : '') + '>' + fmtMoney(sp[s]) + '</b><small>' + esc(side(s)) + '</small></div>';
  return '<div class="ds-two">' + box(me, 'ti', 'me') + box(ot, other, 'ot') + '</div>';
}

function dealBreakEven(d){

function dealStats(){

function dealFromForm(){

const dealMode = () => { const e = $('#sheet-form input[name="dmode"]:checked'); return e ? e.value : 'kilo'; };
const estMode = () => { const e = $('#sheet-form input[name="emode"]:checked'); return e ? e.value : 'cabeza'; };
const nfv = id => { const e = $('#' + id); return e ? numF(e) : null; };
// muestra el bloque del modo elegido (kilo o cabeza)
function dealModeUI(){
  if($('#dm-kilo')){ const k = dealMode() === 'kilo'; $('#dm-kilo').hidden = !k; $('#dm-cab').hidden = k; }
  if($('#de-kilo')){ const m = estMode(); $('#de-tot').hidden = m !== 'total'; $('#de-kilo').hidden = m !== 'kilo'; $('#de-cab').hidden = m !== 'cabeza'; }
}
// calcula el campo que falta: kilo × precio por kilo = total (o al revés), cabezas × precio por cabeza = total
function dealSaleSync(src){
  if(!$('#dm-kilo')) return;
  const n = Math.round(nfv('f-dq') || 0), kilo = dealMode() === 'kilo', blk = kilo ? $('#dm-kilo') : $('#dm-cab');
  if(src === 'u' || src === 'q') blk.dataset.mode = 'u'; else if(src === 't') blk.dataset.mode = 't';
  if(kilo){
    const kg = nfv('f-dkg'), ppk = nfv('f-dku'), tot = nfv('f-dtk');
    if((blk.dataset.mode || 'u') === 'u'){ if(kg > 0 && ppk != null) setF($('#f-dtk'), Math.round(kg * ppk)); }
    else if(kg > 0 && tot != null) setF($('#f-dku'), Math.round(tot / kg));
  } else {
    const u = nfv('f-dcu'), tot = nfv('f-dct');
    if((blk.dataset.mode || 'u') === 'u'){ if(n > 0 && u != null) setF($('#f-dct'), Math.round(n * u)); }
    else if(n > 0 && tot != null) setF($('#f-dcu'), Math.round(tot / n));
  }
}
// lo que valdrían las `left` cabezas: por cabeza, por kilo total (peso de todas × precio por kilo) o por kilo con el peso de cada una
function dealEstCalc(left){
  const m = estMode(); let per = 0, total = 0, kg = 0, ppk = 0;
  if(m === 'total'){ kg = nfv('f-dtkg') || 0; ppk = nfv('f-dtku') || 0; total = Math.round(kg * ppk); per = left > 0 ? Math.round(total / left) : 0; }
  else if(m === 'kilo'){ kg = nfv('f-dekg') || 0; ppk = nfv('f-deku') || 0; per = Math.round(kg * ppk); total = per * left; }
  else { per = nfv('f-dest') || 0; total = Math.round(per * left); }
  return { m: m, per: per, total: total, kg: kg, ppk: ppk };
}

  const n = Math.round(nfv('f-dq') || 0), kilo = dealMode() === 'kilo', tot = nfv(kilo ? 'f-dtk' : 'f-dct'), kg = kilo ? nfv('f-dkg') : null, avg = $('#dm-avg');

/* ---------- seleccionar varias reses (mantener presionada una res) ---------- */
function selOK(){ return !route() && !routePerson() && !routeDeal() && (routeLot() ? S.ltab === 'animales' : S.tab === 'hato'); }
const selIds = () => Object.keys(S.sel || {});
const selBtns = label => S.canWrite ? '<button type="button" class="btn sm sel-hide-on" data-act="sel-start">' + icon('check') + ' ' + (label || 'Seleccionar') + '</button><button type="button" class="btn sm sel-show-on" data-act="sel-end">Listo</button>' : '';
const selHead = () => S.tab === 'hato' && S.loaded && !S.noDb && !S.err && S.animals.some(a => stOf(a) === 'activo') ? selBtns() : '';
function selSync(){
  const on = !!S.sel, n = on ? selIds().length : 0, bar = $('#selbar');
  document.body.classList.toggle('selecting', on);
  document.querySelectorAll('#view .row[data-aid]').forEach(r => r.classList.toggle('sel', on && !!S.sel[r.dataset.aid]));
  bar.hidden = !on;
  if(on){
    $('#sel-n').textContent = n === 0 ? 'Toca las reses que quieras' : plural(n, 'res seleccionada', 'reses seleccionadas');
    bar.querySelectorAll('[data-act="sel-vac"],[data-act="sel-sell"]').forEach(b => { b.disabled = n === 0; });
  }
}
function selStart(id){
  if(!S.canWrite || !selOK()) return;
  S.sel = S.sel || {};
  const a = id ? S.animals.find(x => x.id === id) : null;
  if(a && stOf(a) === 'activo') S.sel[id] = 1;
  selSync();
  try { if(id && navigator.vibrate) navigator.vibrate(25); } catch(e){}
}
function selEnd(){ S.sel = null; selSync(); }
function selToggle(id){
  const a = S.animals.find(x => x.id === id); if(!a || !S.sel) return;
  if(stOf(a) !== 'activo'){ toast('Esta res ya no está en el ganado.'); return; }
  if(S.sel[id]) delete S.sel[id]; else S.sel[id] = 1;
  selSync();
}
function selSell(){
  const ids = selIds(); if(!ids.length) return;
  const lots = {}; ids.forEach(id => { const a = S.animals.find(x => x.id === id); lots[a && a.lotId ? a.lotId : ''] = 1; });
  const keys = Object.keys(lots), l = keys.length === 1 && keys[0] ? lotOf(keys[0]) : null;
  openLotSale(l, ids);
}
let lp = null;
document.addEventListener('pointerdown', ev => {
  if(ev.button > 0 || !S.canWrite) return;
  const row = ev.target.closest && ev.target.closest('#view .row[data-aid]');
  if(lp){ clearTimeout(lp.t); lp = null; }
  if(!row || !selOK()) return;
  const me = { id: row.dataset.aid, x: ev.clientX, y: ev.clientY, fired: false, t: 0 };
  me.t = setTimeout(() => { me.fired = true; if(!S.sel) selStart(me.id); else selToggle(me.id); }, 500);
  lp = me;
});
document.addEventListener('pointermove', ev => { if(lp && !lp.fired && (Math.abs(ev.clientX - lp.x) > 10 || Math.abs(ev.clientY - lp.y) > 10)){ clearTimeout(lp.t); lp = null; } });

// devuelve cada animal a donde estaba, si todavía sigue donde lo dejó este movimiento
async function undoMove(m){
  if(!guard()) return;
  const toPad = m.toPaddock || null, sameSpot = a => (a.paddockId || null) === toPad && (m.toFarm ? isAway(a) && a.away.farm === m.toFarm : !isAway(a));
  const list = (m.animalIds || []).map(id => S.animals.find(a => a.id === id)).filter(a => a && sameSpot(a) && m.prev && m.prev[a.id]);
  await pool(list, a => mutate(a.id, d => { const p = m.prev[a.id]; d.paddockId = p.p || null; d.away = p.aw || null; }), 4);
  await S.db.collection('moves').doc(m.id).delete();
  closeSheet(); toast(list.length === (m.animalIds || []).length ? 'Movimiento deshecho' : 'Movimiento deshecho · ' + plural((m.animalIds || []).length - list.length, 'animal ya se había movido', 'animales ya se habían movido'));

async function stockTake(fd, n, why, date){
  const id = g(fd, 'stk'), it = stockOf(id); if(!id || !it || !(n > 0)) return '';

  await mutateIn('stock', id, d => { const r = stockApply(d, -n, why, date, { by: myId() }); d.qty = r.qty; d.log = r.log; real = -r.real; left = r.qty; });

function feedSync(src){
  const q = document.getElementById('fd-qty'); if(!q) return;
  const sel = document.getElementById('fd-stock'), it = sel && sel.value ? stockOf(sel.value) : null, un = document.getElementById('fd-unit'), cost = document.getElementById('fd-cost'), kind = document.getElementById('fd-kind'), prev = document.getElementById('fd-prev');
  const box = document.getElementById('fd-animal-box'), ts = document.getElementById('fd-target'); if(box && ts) box.classList.toggle('hide', ts.value !== 'a');
  if(src === 'stock'){
    if(it){ if(!kind.value || kind.dataset.auto === '1'){ kind.value = it.name; kind.dataset.auto = '1'; } }
    else if(kind.dataset.auto === '1'){ kind.value = ''; kind.dataset.auto = ''; }
    un.innerHTML = unitOpts(it, un.value); un.disabled = !!it; cost.dataset.touched = '';
  }
  if(src === 'kind') kind.dataset.auto = '';
  if(src === 'cost') cost.dataset.touched = '1';
  const form = document.getElementById('sheet-form'), qty = numF(q) || 0, tg = readTargetDom(), n = feedAnimals(tg.target, tg.id, S.animals).length;
  const price = it && it.price > 0 ? it.price : (+form.dataset.price || 0);
  if(price > 0 && qty > 0 && !cost.dataset.touched && src !== 'cost') setF(cost, Math.round(qty * price));
  const cv = numF(cost) || 0, unit = it ? it.unit : un.value;
  let txt = '', warn = '', bad = false;
  if(!n) txt = 'No hay animales activos en ese grupo.', bad = true;
  else if(qty > 0){
    txt = plural(n, 'cabeza', 'cabezas') + ' · ' + fmtN2(qty / n) + ' ' + unit + ' por cabeza' + (cv > 0 ? ' · ' + fmtMoney(cv / n) + ' por cabeza' : '');
    if(it && qty > (+it.qty || 0)){ warn = 'En el inventario solo hay ' + fmtQty(it.qty) + ' ' + it.unit + ': quedará en 0.'; bad = true; }
  } else txt = n === 1 ? '1 cabeza recibe esto.' : n + ' cabezas reciben esto.';
  prev.innerHTML = '<span>' + esc(txt) + '</span>' + (warn ? ' <span>' + esc(warn) + '</span>' : ''); prev.classList.toggle('bad', bad);
}

    let taken = f.taken || 0; const it = stockOf(f.stockId);
    if(it && (qty !== f.qty || taken)){
      const take = Math.min(qty, (+it.qty || 0) + taken), delta = taken - take;
      if(Math.abs(delta) > 0.0004) await mutateIn('stock', it.id, d => { const r = stockApply(d, delta, 'Se corrigió un registro de alimentación', date, { by: myId(), feed: f.id }); d.qty = r.qty; d.log = r.log; });
      taken = take;
    }
    await mutateIn('feeds', f.id, d => { Object.assign(d, { date, kind, qty, cost, note: g(fd, 'note'), taken }); });
    toast('Registro actualizado');
  }, { submit: 'Guardar cambios' });
}

    if(S.workers.some(x => (!w || x.id !== w.id) && fold(x.name) === fold(name))) return 'Ya tienes a alguien con ese nombre. Agrégale el apellido.';
    const doc = { name, phone, cargo, role, notes };
    if(w){
      await mutateIn('workers', w.id, d => Object.assign(d, doc));
      const m = S.members.find(x => x.fid === S.farm.id && x.wid === w.id && x.role !== 'fuera'); if(m) await setMemberCargo(m.acc, cargo);

        const d2 = Object.assign({}, inv, { role, cargo, label: name }); delete d2.id; await rawColl('invites').doc(inv.id).set(d2); upsert(S.invites, Object.assign({ id: inv.id }, d2));
      }
      render(); toast('Guardado'); return null;
    }
    const wid = uid('wk');

function pwWriteFail(err){

}
function pwTrack(p){
  PW.pend++; pwSyncUI();

  return Promise.resolve();

// lo mismo, pero con internet espera a que el servidor confirme (sin internet sigue de largo)
function pwTrackAck(p){
  const t = pwTrack(p);

  return pwAck(p, 8000).then(() => {}, e => { if(e && e.code === 'timeout') return; throw e; });
}
// escucha con reintentos: si el servidor todavía no se entera de que ya eres parte de la finca, responde "sin permiso"; se vuelve a intentar antes de rendirse
function pwListen(start, bad, tries){
  let un = null, dead = false, n = 0, tm = 0;
  const go = () => { if(dead) return; un = start(err => {
    if(dead) return;
    if(err && err.code === 'permission-denied' && n < (typeof tries === 'function' ? tries() : (tries || 3))){ n++; tm = setTimeout(go, 1200 * n); return; }
    if(bad) bad(err);
  }); };
  go();
  return () => { dead = true; clearTimeout(tm); try { if(un) un(); } catch(e){} };
}
function pwWatchColl(c, ok, bad){
  let first = true, tm = 0, last = null; const key = c.path || String(Math.random());
  const deliver = snap => { first = false; clearTimeout(tm); ok(snap); };
  const stop = pwListen(onErr => c.onSnapshot({ includeMetadataChanges: true }, snap => {
    PW.hp[key] = !!snap.metadata.hasPendingWrites; pwSyncUI(); last = snap;
    if(first){
      // la primera vez, un "vacío" que viene solo del celular no es la verdad: se espera al servidor (hasta 3,5 s)
      if(snap.empty && snap.metadata.fromCache && pwOnline()){ clearTimeout(tm); tm = setTimeout(() => { if(first && last) deliver(last); }, 3500); return; }
      deliver(snap); return;
    }
    if(snap.docChanges().length) ok(snap);
  }, onErr), err => { delete PW.hp[key]; clearTimeout(tm); pwSyncUI(); if(bad) bad(err); }, 3);
  return () => { delete PW.hp[key]; clearTimeout(tm); stop(); pwSyncUI(); };
}

const COLL_ARR = { animals: 'animals', lots: 'lots', sales: 'sales', people: 'people', milk: 'milk', notes: 'notes', avaluos: 'deals', paddocks: 'paddocks', moves: 'moves', stock: 'stock', feeds: 'feeds', plans: 'plans', workers: 'workers' };
// solo se sube lo que cambió: así dos celulares que editan campos distintos del mismo animal no se pisan
function pwDiff(prev, next){
  const out = {}; let n = 0;
  Object.keys(next).forEach(k => { if(JSON.stringify(next[k]) !== JSON.stringify(prev[k])){ out[k] = next[k]; n++; } });
  Object.keys(prev).forEach(k => { if(!(k in next)){ out[k] = FBV().delete(); n++; } });
  return n ? out : null;
}
function pwSetDoc(n, ref, id, x){
  const data = pwClean(S.me ? Object.assign({}, x, { uby: S.me.id, uat: Date.now() }) : x);
  const arr = COLL_ARR[n] ? S[COLL_ARR[n]] : null, prev = arr ? arr.find(r => r.id === id) : null;
  if(prev){
    const p = pwClean(prev); delete p.id;
    const diff = pwDiff(p, data);
    if(diff) return pwTrack(ref.set(diff, { mergeFields: Object.keys(diff) }));
    return Promise.resolve();
  }
  return pwTrack(ref.set(data));
}
function farmDb(raw, fid){
  const base = 'fincas/' + fid + '/';
  return { collection: n => {
    if(GLOBAL_COLL[n]) return raw.collection(n);
    const c = FS.collection(base + n);
    return {
      onSnapshot: (ok, bad) => pwWatchColl(c, ok, bad),
      doc: id => ({
        set: x => pwSetDoc(n, c.doc(id), id, x),
        delete: o => (S.canDelete || (o && o.internal)) ? pwTrack(c.doc(id).delete()) : Promise.reject(new Error('Solo el administrador puede borrar.'))

function shrink(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', q || 0.78);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

const PW_RULE_MSG = 'La contraseña debe tener al menos 8 caracteres, con letras y números.';

   Firebase solo entiende correos. A quien no tiene, la app le arma uno que nadie puede tener: su cédula + @cedula.mi-finca.invalid.
   «.invalid» está reservado en internet para esto: ese correo nunca recibe ni manda nada. Por eso, con cédula no hay enlace por correo. */
const CC_HOST = 'cedula.mi-finca.invalid';
const ccEmail = d => d + '@' + CC_HOST;
const isCcEmail = e => String(e || '').toLowerCase().slice(-(CC_HOST.length + 1)) === '@' + CC_HOST;

  if(t.indexOf('@') > -1){
    const e = t.toLowerCase();
    return validEmail(e) ? { email: e, cc: false } : { err: 'Revisa el correo electrónico: debe tener @ y un punto, por ejemplo nombre@correo.com.' };

  if(c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid' || c === 'auth/app-not-authorized' || c === 'auth/unauthorized-domain' || c === 'auth/configuration-not-found' || c === 'auth/internal-error' || c.indexOf('auth/requests-from-referer') === 0) return 'La app no está autorizada para conectarse (clave o dominio). Avísale a quien administra la app.';

      '<div class="two">' + fld('s-name', 'Nombres', ainp('s-name', 'name', 'text', 'given-name', 'autocapitalize="words"')) + fld('s-last', 'Apellidos', ainp('s-last', 'last', 'text', 'family-name', 'autocapitalize="words"')) + '</div>' +
      fld('s-doc', 'Cédula de ciudadanía', ainp('s-doc', 'doc', 'text', 'off', 'data-doc="cc" inputmode="numeric"'), 'Solo números: los puntos se ponen solos.') +
      '<label class="chk" for="s-nomail"><input type="checkbox" name="nomail" id="s-nomail"><span>No tengo correo electrónico: ingreso con mi cédula</span></label>' +
      '<p class="muted" id="s-nomail-note" style="margin:-4px 0 14px;font-size:13px;line-height:1.4" hidden>Ingresarás con tu cédula y tu contraseña. Sin correo no se puede mandar un enlace si la olvidas: anótala en un lugar seguro.</p>' +
      '<div id="s-email-wrap">' + fld('s-email', 'Correo electrónico', ainp('s-email', 'email', 'email', 'email', TXT + ' inputmode="email"'), 'Con este correo ingresas y, si olvidas la contraseña, te llega el enlace para cambiarla.') + '</div>' +
      pwField('s-pw', 'pw', 'Contraseña', 'new-password', 'Mínimo 8, con letras y números.') +
      pwField('s-pw2', 'pw2', 'Repite la contraseña', 'new-password') + errP +
      '<button type="submit" class="btn primary wide" id="auth-ok">Crear cuenta</button></form>' +
      '<div class="auth-new"><p>¿Ya tienes cuenta?</p><button type="button" class="btn wide" data-act="auth-mode" data-m="login">Ingresar</button></div>';
  } else {
    c = '<h2>¿Olvidaste tu contraseña?</h2><p class="muted" style="margin-bottom:12px">Escribe el correo de tu cuenta y te mando un enlace para poner una contraseña nueva.</p><form id="auth-form" data-m="forgot" novalidate>' +
      fld('f-ident', 'Correo electrónico', ainp('f-ident', 'ident', 'text', 'username', 'inputmode="email" ' + TXT), '¿Ingresas con tu cédula y no tienes correo? Entonces no hay enlace: avísale al administrador de tu finca.') + errP +
      '<button type="submit" class="btn primary wide" id="auth-ok">Enviarme el enlace</button></form>' +
      '<p class="auth-alt"><button type="button" class="link" data-act="auth-mode" data-m="login">← Volver a ingresar</button></p>';
  }
  return '<div class="auth"><div class="auth-brand"><span class="logo lg" aria-hidden="true">' + FENCE + '</span><div><h1 class="brandname">Mi Finca</h1><span class="top-sub">Libro del rancho</span></div></div><div class="auth-card">' + inviteBanner() + c + '</div></div>';
}

function openChangePw(){
  const body = pwField('cp-old', 'old', 'Contraseña actual', 'current-password') + pwField('cp-new', 'new', 'Contraseña nueva', 'new-password', 'Mínimo 8, con letras y números.') + pwField('cp-new2', 'new2', 'Repite la contraseña nueva', 'new-password');
  openSheet('Cambiar mi contraseña', body, async fd => {
    if(!pwOnline()) return 'No hay conexión. Para cambiar la contraseña necesitas internet.';
    const pw = String(fd.get('new') || ''), msg = validatePw(pw, String(fd.get('new2') || '')) || pwRule(pw, AUTH.currentUser && AUTH.currentUser.email); if(msg) return msg;
    const u = AUTH.currentUser; if(!u) return 'Ingresa de nuevo e intenta otra vez.';
    try {
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, String(fd.get('old') || '')));
    } catch(e){ return (e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials')) ? 'La contraseña actual no es correcta.' : pwAuthMsg(e); }
    try { await u.updatePassword(pw); } catch(e){ return pwAuthMsg(e); }

function openResetPw(a){

/* ---------- arranque ---------- */
function pwProfileFallback(user){
  const cc = isCcEmail(user.email);
  return { id: user.uid, name: cc ? 'Usuario' : String(user.email || 'Usuario').split('@')[0], last: '', doc: cc ? ccOfEmail(user.email) : '', email: cc ? '' : (user.email || ''), createdAt: 0, pwAt: 0 };
}
function pwSignedIn(gen, user, data){
  const first = !S.me;
  S.me = Object.assign({ id: user.uid, pwAt: 0 }, data); S.accLoaded = true; S.auth = ''; S.notice = ''; S.slow = false;
  pwSync(); if(first) window.scrollTo(0, 0);
  pwSyncUI();
}
function pwOnAuth(user){
  const gen = ++PW.gen;
  pwStopAll();
  if(!user){
    PW.user = null; S.me = null; S.accounts = []; S.farms = []; S.members = []; S.got = { fincas: true, members: true, invites: true };
    if(S.farm) leaveFarm();
    S.accLoaded = true; closeSheet(); pwRecompute(); pwSyncUI(); render(); window.scrollTo(0, 0);
    return;
  }
  PW.user = user; S.got = {};
  let loaded = false;
  const fb = setTimeout(() => { if(gen === PW.gen && !S.me) pwSignedIn(gen, user, pwProfileFallback(user)); }, 8000);
  PW.unsubs.push(FS.doc('users/' + user.uid).onSnapshot(snap => {
    if(gen !== PW.gen) return;
    if(snap.exists){ clearTimeout(fb); loaded = true; pwSignedIn(gen, user, snap.data()); }
    else if(!snap.metadata.fromCache && !PW.signing){ clearTimeout(fb); pwSignedIn(gen, user, pwProfileFallback(user)); }
  }, () => { if(gen === PW.gen && !S.me){ clearTimeout(fb); pwSignedIn(gen, user, pwProfileFallback(user)); } }));
  PW.unsubs.push(FS.collection('users/' + user.uid + '/farms').onSnapshot(snap => {
    if(gen !== PW.gen) return;
    const ids = snap.docs.map(d => d.id), keep = {}; ids.forEach(i => { keep[i] = 1; });
    Object.keys(PW.opt).forEach(i => { if(PW.opt[i] && Date.now() - PW.opt[i].at < 20000) keep[i] = 1; });
    Object.keys(PW.ptr).forEach(i => { if(!keep[i]){ delete PW.ptr[i]; pwDropFarm(i); } });
    ids.forEach(i => { PW.ptr[i] = 1; pwWatchFarm(i); });
    PW.ptrReady = true; pwSync();
  }, () => { if(gen === PW.gen){ PW.ptrReady = true; PW.forced = true; pwSync(); } }));
  setTimeout(() => { if(gen === PW.gen && !S.got.fincas){ PW.forced = true; PW.ptrReady = true; pwSync(); } }, 9000);
}
async function init(){
  S.invite = inviteFromHash();
  if(S.invite) location.hash = 'inicio';
  S.multi = true; S.isPwa = true; S.role = ''; S.platW = true; S.isOwner = false; S.assets = PWASSETS; S.downloads = PWDOWN; S.raw = S.db = PWRAW;
  render();
  if(!FBCFG || !window.firebase || !FBCFG.apiKey || /PEGA|TU_/.test(String(FBCFG.apiKey))){ S.noDb = true; S.loaded = true; S.role = 'admin'; S.accLoaded = true; setPerms(); render(); return; }
  try {
    firebase.initializeApp(FBCFG);
    FS = firebase.firestore(); AUTH = firebase.auth();
    try { FS.settings({ cacheSizeBytes: 250 * 1024 * 1024, ignoreUndefinedProperties: true }); } catch(e){}
    try { await FS.enablePersistence({ synchronizeTabs: true }); } catch(e){ PW.noPersist = true; }
  } catch(e){ S.noDb = true; S.loaded = true; S.role = 'admin'; S.accLoaded = true; setPerms(); render(); return; }
  setPerms(); pwSyncUI();
  const atimer = setTimeout(() => { if(!S.accLoaded){ S.slow = true; render(); } }, 10000);
  if(S.invite) lookupInvite(S.invite).then(() => { maybeInvite(); render(); });
  AUTH.onAuthStateChanged(u => { clearTimeout(atimer); pwOnAuth(u); }, () => { clearTimeout(atimer); pwOnAuth(null); });
  try { if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; if(w) w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) toast('Hay una versión nueva. Cierra la app y ábrela otra vez.'); }); });
  }).catch(() => {}); } catch(e){}
}

init();

/* ---------- traer una copia de seguridad (solo en la app instalable, solo el administrador) ---------- */
let BKI = null;
function openBackupImport(){
  if(!S.farm || !isAdmin()) return;
  BKI = null;
  openSheet('Traer una copia de seguridad',
    '<p>Escoge el archivo de la copia (termina en .json). Sus datos se agregan a «' + esc(S.farm.name) + '». Si algo ya existe con el mismo código, se reemplaza.</p>' +
    '<label class="btn primary wide" for="bk-file" style="margin-top:12px">Escoger el archivo</label>' +
    '<input type="file" id="bk-file" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none" tabindex="-1">' +
    '<p class="muted" style="margin-top:12px">Se trae con internet. Pueden pasar unos minutos si hay muchas fotos.</p>', null, { noFoot: true });
}
document.addEventListener('change', async ev => {
  const t = ev.target; if(!t || t.id !== 'bk-file' || !t.files || !t.files[0]) return;
  let d = null;
  try { d = JSON.parse(await t.files[0].text()); } catch(e){ toast('No se pudo leer el archivo.'); return; }
  if(!d || d.app !== 'mi-finca-copia' || !d.data || typeof d.data !== 'object'){ toast('Ese archivo no es una copia de seguridad de Mi Finca.'); return; }
  const counts = {}; BK_COLLS.forEach(c => { counts[c[0]] = Array.isArray(d.data[c[0]]) ? d.data[c[0]].filter(r => r && r.id).length : 0; });
  const photos = d.photos && typeof d.photos === 'object' ? d.photos : {}, nph = Object.keys(photos).length;
  if(!BK_COLLS.some(c => counts[c[0]])){ toast('Esa copia está vacía.'); return; }
  BKI = { d, photos };
  openSheet('Traer la copia',
    '<p>Esta copia es de «' + esc((d.finca && d.finca.name) || 'una finca') + '» y trae:</p>' + bkLines(counts, nph) +
    '<p class="muted" style="margin-top:8px">Se agregan a «' + esc(S.farm.name) + '». Lo que ya exista con el mismo código se reemplaza.</p>',
    async (fd, setLabel) => {
      if(!BKI || !S.farm || !isAdmin() || !FS) return 'No se pudo traer todo. Revisa tu conexión y vuelve a intentar.';
      if(!pwOnline()) return 'Para traer la copia necesitas internet.';
      const { d, photos } = BKI, fid = S.farm.id, now = Date.now(), who = S.me ? S.me.id : '', ops = []; let skipped = 0;
      BK_COLLS.forEach(c => (Array.isArray(d.data[c[0]]) ? d.data[c[0]] : []).forEach(r => {
        if(!r || !r.id || /\//.test(String(r.id))){ if(r) skipped++; return; }
        const x = pwClean(r), id = String(x.id); delete x.id; x.uby = who; x.uat = now;
        const n = JSON.stringify(x).length; if(n > 950000){ skipped++; return; }
        ops.push([FS.doc('fincas/' + fid + '/' + c[0] + '/' + id), x, n]);
      }));
      if(d.config && d.config.sale && +d.config.sale.from > 0 && +d.config.sale.to > 0) ops.push([FS.doc('fincas/' + fid + '/config/sale'), { from: +d.config.sale.from, to: +d.config.sale.to, at: now }, 80]);
      Object.keys(photos).forEach(id => {
        const u = photos[id]; if(typeof u !== 'string' || !/^data:image\//.test(u) || u.length > 900000 || /\//.test(id)){ skipped++; return; }
        PH[id] = u; ops.push([FS.doc('fincas/' + fid + '/photos/' + id), { data: u, at: now, by: who }, u.length]);
      });
      let batch = FS.batch(), cnt = 0, bytes = 0, done = 0;
      const commit = () => Promise.race([batch.commit(), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 90000))]);
      try {
        for(const op of ops){
          if(cnt && (cnt >= 300 || bytes + op[2] > 2500000)){ await commit(); done += cnt; setLabel('Subiendo… ' + done + ' de ' + ops.length); batch = FS.batch(); cnt = 0; bytes = 0; }
          batch.set(op[0], op[1]); cnt++; bytes += op[2];
        }
        if(cnt){ await commit(); done += cnt; }
      } catch(e){ return e && e.message === 'timeout' ? 'Se cortó la conexión. Vuelve a intentar: lo que ya se subió no se repite.' : 'No se pudo traer todo. Revisa tu conexión y vuelve a intentar.'; }
      BKI = null;
      toast(skipped ? 'Listo, pero ' + skipped + (skipped === 1 ? ' dato no se pudo traer.' : ' datos no se pudieron traer.') : 'Listo: se trajeron los datos de la copia.');
      return null;
    }, { submit: 'Traer los datos' });
});
async function bkPhoto(id){ return phLoad(id); }
})();
